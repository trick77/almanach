<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock · Projektseite · Almanach</title>
<style>
  @font-face { font-family: "Anthropic Sans"; src: url("../../ui/src/fonts/SansWebVariable-TextRegular.woff2") format("woff2"); font-weight: 300 800; font-display: swap; }
  @font-face { font-family: "Anthropic Serif"; src: url("../../ui/src/fonts/SerifWebVariable-TextRegular.woff2") format("woff2"); font-weight: 300 800; font-display: swap; }
  @font-face { font-family: "Anthropic Mono"; src: url("../../ui/src/fonts/MonoVariableVariable-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }

  /* Warm Editorial dark: ui/src/index.css, verbatim. */
  :root {
    --bg: #1f1f1e; --panel: #1b1b1a; --active: #2c2c2a; --border: #323230; --border-soft: #2a2a28;
    --ink: #faf9f5; --ink-dim: #e4e1d8; --ink-prose: #f3f0e8; --wordmark: #f4f0e8; --muted: #9c9a92; --faint: #6f6d66;
    --accent: #c6613f; --accent-strong: #d97757; --accent-fill: #c25f34; --accent-dim: #5a3527;
    --online: #5aa06a; --danger: #c14638; --danger-ink: #ec7e7e;
    --ochre: #d6a15a; --ochre-wash: rgba(214,161,90,.14);
    --elevated: #363632; --elevated-border: #454540;
    --diagram-surface: #151514; --diagram-line: #3b3935; --diagram-fg: #ece8df; --diagram-muted: #a29e94;
    --sans: "Anthropic Sans", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: "Anthropic Serif", Georgia, "Times New Roman", serif;
    --mono: "Anthropic Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --r: 10px; --r-sm: 8px;
    --top: 28px; /* the one top edge every column starts on */
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--mono); font-size: 12.5px; }

  /* The mock's own chrome: a fake URL bar with the variant switch. */
  .urlbar { display: flex; gap: 12px; align-items: center; height: 38px; padding: 0 14px; background: #141413; border-bottom: 1px solid var(--border); font: 12px var(--mono); color: var(--faint); }
  .urlbar b { color: var(--muted); font-weight: 400; }
  .urlbar .hint { font-family: var(--sans); font-style: italic; }
  .urlbar .seg { margin-left: auto; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; font-family: var(--sans); }
  .seg button { padding: 3px 11px; font-size: 12.5px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--active); color: var(--ink); }

  .app { display: grid; grid-template-rows: 46px 1fr; height: calc(100vh - 38px); }
  header.top { display: flex; align-items: center; gap: 24px; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { margin: 0; font: 500 21px/28px var(--serif); color: var(--wordmark); }
  header nav { display: flex; flex: 1; gap: 2px; }
  header nav a { padding: 5px 12px; border-radius: var(--r-sm); font-size: 14px; color: var(--muted); }
  header nav a[aria-current="page"] { background: var(--active); color: var(--ink); }
  main { min-height: 0; overflow: auto; scroll-behavior: smooth; }

  /* ---- The page grid. Every cell starts at --top: no column sits lower. */
  .shell { display: grid; gap: 0 44px; justify-content: center; align-items: start; padding: var(--top) 32px 80px; }
  .v-a .shell { grid-template-columns: 196px minmax(0, 700px) 300px; }
  .v-b .shell { grid-template-columns: 196px minmax(0, 900px); }
  .v-c .shell, .v-d .shell { grid-template-columns: 196px minmax(0, 900px); }
  .v-c.tab-ov .shell { grid-template-columns: minmax(0, 900px); }
  .shell > * { min-width: 0; }

  /* Rail: search, then the page's table of contents. Sticky inside main. */
  .rail { position: sticky; top: var(--top); max-height: calc(100vh - 38px - 46px - var(--top) - 16px); overflow: auto; padding-right: 4px; }
  .search { position: relative; display: block; }
  .search input { width: 100%; height: 34px; padding: 0 30px 0 32px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--panel); font-size: 13.5px; outline: none; }
  .search input:focus { border-color: var(--elevated-border); background: var(--active); }
  .search input::placeholder { color: var(--faint); }
  .search svg { position: absolute; left: 10px; top: 10px; color: var(--faint); }
  .search kbd { position: absolute; right: 8px; top: 8px; padding: 0 5px; border: 1px solid var(--border); border-radius: 4px; font: 11px/16px var(--mono); color: var(--faint); }
  .hits { min-height: 18px; margin: 6px 2px 0; font-size: 12px; color: var(--faint); }
  .hits b { color: var(--ochre); font-weight: 500; }
  .toc { margin-top: 10px; }
  .toc .grp { margin: 14px 0 4px 10px; font-size: 10.5px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .toc .grp:first-child { margin-top: 0; }
  .toc a { display: flex; align-items: baseline; gap: 8px; padding: 3px 10px; border-left: 2px solid transparent; font-size: 13.5px; color: var(--muted); }
  .toc a:hover { color: var(--ink); }
  .toc a.on { border-left-color: var(--accent); color: var(--ink); }
  .toc a .n { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--faint); }
  .toc a.zero { color: var(--faint); }
  .toc a.hit .n { color: var(--ochre); }
  .toc a.mono-l { font-family: var(--mono); font-size: 12.5px; }
  .toc a.cur { border-left-color: var(--elevated-border); color: var(--ink); }
  .toc .grp a.grplink { display: inline; padding: 0 0 0 4px; border: 0; color: var(--muted); letter-spacing: 0; text-transform: none; font-size: 12px; } .toc .grplink:hover { color: var(--ink); }
  .revs { margin: 0; padding: 0; list-style: none; }
  .revs li { display: flex; align-items: baseline; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--border-soft); font-size: 13.5px; color: var(--ink-dim); }
  .revs .rn { width: 34px; color: var(--muted); font-variant-numeric: tabular-nums; } .revs .rf { flex: 1; }
  .revs .cur { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ochre); }
  .toc a.other:not(.zero) { color: #85837b; } .toc a.other:hover { color: var(--ink); }

  /* Content column, ui.tsx classes. */
  .crumbs { font-size: 13px; line-height: 20px; color: var(--faint); }
  .crumbs a { color: var(--muted); }
  .crumbs b { font-weight: 400; color: var(--ink-dim); }
  .sep { margin: 0 7px; color: var(--faint); }
  h2 { margin: 6px 0 0; font: 500 28px/1.15 var(--serif); letter-spacing: -.01em; }
  .meta { margin-top: 6px; font-size: 14.5px; color: var(--muted); }
  .meta .dim { color: var(--ink-dim); }
  .eyebrow { margin: 28px 0 10px; font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); display: flex; align-items: baseline; gap: 10px; }
  .eyebrow .aside { letter-spacing: 0; text-transform: none; font-weight: 400; }
  .eyebrow .more { margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--muted); }
  .eyebrow .more:hover { color: var(--ink); }
  section[id] { scroll-margin-top: 16px; }

  .map { height: 250px; border: 1px solid var(--border-soft); border-radius: var(--r); background: var(--diagram-surface); overflow: hidden; }
  .map svg { width: 100%; height: 100%; }
  .maplink { cursor: pointer; } .maplink rect { transition: fill .12s, stroke .12s; }
  .maplink:hover rect, .maplink:focus-visible rect { fill: #2a2622; stroke: #ece8df; }

  .summary p { margin: 0 0 14px; font: 17px/1.6 var(--serif); color: var(--ink-prose); }
  .kindhead { margin: 30px 0 4px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); display: flex; gap: 10px; align-items: baseline; }
  .kindhead .c { letter-spacing: 0; font-weight: 400; text-transform: none; }
  article { padding: 12px 0; border-top: 1px solid var(--border-soft); }
  .kindhead + article { border-top: 0; }
  article h4 { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); }
  article .txt p { margin: 4px 0 10px; font: 15.5px/1.55 var(--serif); color: var(--ink-dim); }
  article .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; padding: 0 7px; border: 1px solid var(--accent-dim); border-radius: 6px; background: rgba(198,97,63,.1); font: 11px/18px var(--mono); color: var(--accent-strong); white-space: nowrap; }
  .chip.quiet { border-color: var(--elevated-border); background: none; color: var(--muted); }
  mark { background: var(--ochre-wash); color: var(--ochre); border-radius: 2px; padding: 0 1px; }
  .none { font-size: 13.5px; color: var(--faint); padding: 4px 0; }

  /* Tables, ui.tsx classes. */
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
  th { padding: 0 10px 8px 0; border-bottom: 1px solid var(--border); text-align: left; font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
  td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--border-soft); vertical-align: top; color: var(--ink-dim); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.mono { white-space: nowrap; }
  td a.mono { color: var(--ink-dim); } td a.mono:hover { color: var(--ink); }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 0 7px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 19px; }
  .pill i { width: 6px; height: 6px; border-radius: 50%; }
  .pill.warn { background: var(--ochre-wash); color: var(--ochre); } .pill.warn i { background: var(--ochre); }
  .pill.fail { background: rgba(193,70,56,.15); color: var(--danger-ink); } .pill.fail i { background: var(--danger); }
  .faint { color: var(--faint); }

  /* Side column (variant A): the project's facts as short lists, not tables. */
  .side > .eyebrow:first-child { margin-top: 0; }
  .side .eyebrow { margin: 26px 0 6px; }
  .rlist > a, .rlist > div.row { display: block; padding: 8px 0; border-top: 1px solid var(--border-soft); }
  .rlist > :first-child { border-top: 0; padding-top: 2px; }
  .rlist .t { display: flex; align-items: baseline; gap: 8px; }
  .rlist .t .mono { color: var(--ink-dim); }
  .rlist a:hover .t .mono { color: var(--ink); }
  .rlist .t .r { margin-left: auto; font-size: 12px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rlist .d2 { margin-top: 3px; font-size: 13px; color: var(--muted); }
  .rlist .d { margin-top: 2px; font-size: 13px; line-height: 1.45; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* Tabs (variant C), the Segmented look from ui.tsx. */
  .tabs { display: flex; gap: 2px; margin-top: 18px; border-bottom: 1px solid var(--border); }
  .tabs button { padding: 7px 12px; margin-bottom: -1px; border-bottom: 2px solid transparent; font-size: 14px; color: var(--muted); }
  .tabs button[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--ink); }
  .tabs button .n { margin-left: 6px; font-size: 12px; color: var(--faint); }

  /* The decisions this mock asks for; not part of the app. */
  .mocknote { margin-top: 48px; padding: 16px 18px; border: 1px dashed var(--elevated-border); border-radius: var(--r); font-size: 13.5px; color: var(--muted); }
  .mocknote h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--ink-dim); }
  .mocknote ol { margin: 0; padding-left: 18px; } .mocknote li { margin: 6px 0; }
  .mocknote b { color: var(--ink-dim); font-weight: 500; }

  /* Narrow: rail becomes a sticky search + chip row above the content; the
     side column drops under the header, before the description. */
  @media (max-width: 1180px) {
    .v-a .shell, .v-b .shell, .v-c .shell, .v-d .shell { grid-template-columns: minmax(0, 900px); }
    .rail { position: sticky; top: 0; z-index: 2; max-height: none; margin: 0 -32px; padding: 10px 32px; background: var(--bg); border-bottom: 1px solid var(--border-soft); display: flex; gap: 12px; align-items: center; overflow-x: auto; }
    .search { flex: 0 0 240px; } .hits { display: none; }
    .toc { margin: 0; display: flex; gap: 2px; white-space: nowrap; }
    .toc .grp { display: none; }
    .toc a { border-left: 0; border-radius: 999px; padding: 3px 10px; } .toc a.on { background: var(--active); }
    .v-a .side { order: 1; margin-top: 20px; } .v-a .content { order: 2; }
  }
</style>
</head>
<body class="v-a">
<div class="urlbar">▸ <b id="url">almanach.example.invalid/projekte/SHOP</b><span class="hint">Mock · Projekt- und Repo-Seite · in D Repositories klickbar</span>
  <div class="seg" role="group" aria-label="Variante">
    <button aria-pressed="true" data-v="a">A · Rail + Seitenspalte</button>
    <button aria-pressed="false" data-v="b">B · Rail, umsortiert</button>
    <button aria-pressed="false" data-v="c">C · Reiter</button>
    <button aria-pressed="false" data-v="d">D · B + C</button>
  </div>
</div>
<div class="app">
  <header class="top">
    <h1>Almanach</h1>
    <nav><a href="#" aria-current="page">Projekte</a><a href="#">Quellen</a><a href="#">FAQ</a></nav>
  </header>
  <main id="main"><div class="shell" id="shell"></div></main>
</div>

<script>
/* ---------------- data (fictional) ---------------- */
const KINDS = [
  ["invariant", "Invarianten"], ["rule", "Regeln"], ["decision", "Entscheidungen"],
  ["pitfall", "Fallstricke"], ["component", "Komponenten"], ["entity", "Entitäten"],
];
const PR = (n) => ({ pr: "SHOP-" + n });
const B = (r, c) => ({ b: r, c });
const ST = [
  ["invariant", "Bestellung wird nur einmal belastet", "Jede Bestellung trägt einen Idempotenzschlüssel, den `acme-gateway` beim ersten Checkout-Aufruf vergibt und bis zur Bestätigung des Zahlungsanbieters festhält. Ein zweiter Aufruf mit demselben Schlüssel liefert das gespeicherte Ergebnis zurück, statt erneut zu belasten.\n\nDer Schlüssel lebt in der Tabelle `payment_attempts` und wird nie gelöscht, nur archiviert. Wer den Checkout-Pfad umbaut, muss den Schlüssel durchreichen; ein neuer Endpunkt ohne Schlüssel öffnet die doppelte Belastung wieder, die SHOP-388 geschlossen hat.", ["acme-core/payments/attempt.go", "acme-gateway/checkout/handler.go"], [PR(388), B("acme-core", "5d21b0a")]],
  ["invariant", "Preise sind Ganzzahlen in Rappen", "Alle Beträge im System sind ganze Rappen (`int64`), vom Katalog über den Warenkorb bis zur Rechnung. Gleitkommazahlen kommen nur in der Anzeige vor und werden dort aus dem Ganzzahlwert formatiert.\n\nRundung passiert genau einmal: bei der Mehrwertsteuer, kaufmännisch, pro Position. Eine Summe über bereits gerundete Positionen darf nicht erneut gerundet werden.", ["acme-core/money/money.go"], [B("acme-core", "5d21b0a")]],
  ["invariant", "Lagerbestand sinkt nie unter null", "Die Reservation im Lager ist ein bedingtes Update (`stock >= qty`), kein Lesen-dann-Schreiben. Schlägt es fehl, gilt der Artikel als ausverkauft, auch wenn die Anzeige einen Moment länger Bestand zeigt.", ["acme-core/inventory/reserve.go"], [PR(402), B("acme-core", "5d21b0a")]],
  ["invariant", "Ereignisse sind nach Bestellung geordnet", "Ereignisse einer Bestellung werden über ihre Bestellnummer partitioniert, damit `Bezahlt` nie vor `Angelegt` beim Versand ankommt. Ereignisse verschiedener Bestellungen haben keine Reihenfolge, und kein Konsument darf eine annehmen.", ["acme-core/events/publish.go"], [B("acme-core", "5d21b0a")]],
  ["invariant", "Kundendaten verlassen nie das Gateway", "Name, Adresse und E-Mail bleiben in `acme-gateway`; `acme-core` sieht nur die Kunden-ID. Logs, Ereignisse und Exporte führen ausschliesslich die ID, und der Export-Job in `acme-cli` löst sie über die Gateway-API auf, nie über die Datenbank direkt.", ["acme-gateway/customers/", "acme-cli/export/"], [PR(371), B("acme-gateway", "a81f3c2")]],
  ["rule", "Neue Endpunkte nur über den Router", "Ein Endpunkt wird in `routes.go` eingetragen, nicht in einem Handler selbst registriert. So bleiben Authentifizierung, Ratenbegrenzung und das Zugriffslog an einer Stelle, und der Router-Test listet jeden Pfad.", ["acme-gateway/routes.go"], [B("acme-gateway", "a81f3c2")]],
  ["rule", "Migrationen nur vorwärts", "Eine angewendete Migration wird nie geändert. Eine Korrektur ist eine neue Migration mit der nächsten Nummer; der Start prüft die Prüfsummen und verweigert den Betrieb bei Abweichung.", ["acme-core/migrations/"], [B("acme-core", "5d21b0a")]],
  ["rule", "Zeitzonen nur am Rand", "Intern ist jede Zeit UTC. Die Umrechnung nach Europe/Zurich passiert in der Anzeige und in den Rechnungs-PDFs, sonst nirgends. Ein Zeitstempel ohne Zone ist ein Fehler, den der Linter meldet.", ["acme-core/clock/", "acme-docs/conventions.md"], [PR(355)]],
  ["rule", "Feature-Flags laufen aus", "Jedes Flag trägt ein Ablaufdatum. Nach dem Datum schlägt der Build fehl, bis das Flag entfernt oder verlängert ist; verlängert wird mit Begründung im Pull Request.", ["acme-core/flags/flags.go"], [PR(410)]],
  ["rule", "Fehlertexte sind Schweizerdeutsch", "Alles, was ein Kunde sieht, kommt aus den Textdateien in `acme-gateway/i18n`. Kein Handler setzt einen Text selbst; Fehlercodes sind stabil, Texte dürfen sich ändern.", ["acme-gateway/i18n/"], [B("acme-gateway", "a81f3c2")]],
  ["rule", "CLI spricht nur mit der API", "`acme-cli` hat keinen Datenbankzugang. Was die CLI braucht, bekommt einen Endpunkt mit eigenem Scope, auch für Admin-Aufgaben.", ["acme-cli/client/"], [B("acme-cli", "f4e0a91")]],
  ["decision", "Zahlungsanbieter hinter eigener Schnittstelle", "Der Anbieter steckt hinter `PaymentProvider`, damit ein Wechsel eine Implementierung ist, kein Umbau. Entschieden nach dem Ausfall im Frühjahr, als ein zweiter Anbieter in Stunden statt Wochen hätte einspringen sollen.\n\nDie Schnittstelle kennt nur Autorisieren, Belasten, Erstatten; anbieterspezifische Funktionen bleiben bewusst draussen.", ["acme-core/payments/provider.go"], [PR(366), B("acme-core", "5d21b0a")]],
  ["decision", "Kein ORM", "Abfragen sind handgeschriebenes SQL mit generierten Typen. Der Grund: die Lagerreservation und die Rechnungsläufe brauchen Sperren und bedingte Updates, die ein ORM verdeckt.", ["acme-core/db/queries.sql"], [B("acme-core", "5d21b0a")]],
  ["decision", "Ereignisse statt Aufrufe zum Versand", "Der Versand erfährt von bezahlten Bestellungen über Ereignisse, nicht über einen synchronen Aufruf. Ein langsamer Versanddienst bremst so den Checkout nicht; der Preis ist eine Verzögerung von Sekunden bis zum Versandauftrag.", ["acme-core/events/"], [PR(341)]],
  ["decision", "Dokumentation im eigenen Repository", "Betriebs- und Entwicklerdoku liegt in `acme-docs`, nicht in den Code-Repositories, weil sie über Repository-Grenzen hinweg beschreibt. Code-nahe Kommentare bleiben im Code.", ["acme-docs/"], [B("acme-docs", "0c9e77d")]],
  ["component", "acme-gateway", "Der öffentliche Eingang: Authentifizierung, Ratenbegrenzung, Kundendaten und der Checkout-Ablauf. Hält die Kundendaten und gibt `acme-core` nur IDs weiter.\n\nLäuft zustandslos in drei Instanzen; Sitzungen liegen im Cookie, signiert, nicht in einem Speicher.", ["acme-gateway/"], [B("acme-gateway", "a81f3c2")]],
  ["component", "acme-core", "Die Fachlogik: Katalog, Warenkorb, Lager, Zahlungen, Rechnungen. Besitzt die Datenbank und veröffentlicht die Bestellereignisse.", ["acme-core/"], [B("acme-core", "5d21b0a")]],
  ["component", "Rechnungslauf", "Ein nächtlicher Job in `acme-core` schreibt die Rechnungen des Vortags, nummeriert lückenlos und legt die PDFs ab. Ein abgebrochener Lauf setzt beim letzten fertigen Beleg fort, nie davor.", ["acme-core/billing/run.go"], [PR(399)]],
  ["component", "acme-cli", "Werkzeug für Support und Betrieb: Bestellungen nachschlagen, Erstattungen auslösen, Exporte ziehen. Spricht nur mit der Gateway-API.", ["acme-cli/"], [B("acme-cli", "f4e0a91")]],
  ["component", "acme-docs", "Statische Doku-Site, aus Markdown gebaut. Beschreibt Betrieb, Konventionen und die Ereignisformate.", ["acme-docs/"], [B("acme-docs", "0c9e77d")]],
  ["entity", "Bestellung", "Kopf mit Kunden-ID, Status und Summe, dazu Positionen mit Artikel, Menge und Preis zum Bestellzeitpunkt. Der Preis wird kopiert, nicht referenziert, damit spätere Katalogänderungen alte Bestellungen nicht verändern.", ["acme-core/orders/model.go"], [B("acme-core", "5d21b0a")]],
  ["entity", "Zahlungsversuch", "Ein Versuch pro Idempotenzschlüssel, mit Anbieterreferenz und Ergebnis. Erstattungen sind eigene Versuche, die auf den ursprünglichen zeigen.", ["acme-core/payments/attempt.go"], [PR(388)]],
  ["entity", "Lagerposten", "Artikel, Lager und Bestand. Reservationen sind eigene Zeilen mit Ablaufzeit, damit ein abgebrochener Checkout den Bestand von selbst freigibt.", ["acme-core/inventory/model.go"], [PR(402)]],
].map(([kind, name, text, files, sources], i) => ({ id: i, kind, name, text, files, sources }));

    shell.innerHTML = r + `<div class="content">${header()}${tabs}${body}${NOTE}</div>`;
  }
  wire();
}
/* Search re-renders the description only, so focus and caret stay put. */
function setQ(q) {
  Q = q.trim();
  /* D: typing on Übersicht switches to Beschreibung, where the hits are. */
  if (V === "d" && TAB === "ov") {
    if (!Q) return;
    TAB = "desc"; render(); const i = document.getElementById("q"); i.value = q; i.focus(); i.setSelectionRange(q.length, q.length); return;
  }
  const inp = document.getElementById("q"); if (inp && inp.value !== q) inp.value = q;
  const pos = inp && inp.selectionStart;
  const content = document.querySelector(".content");
  const old = content.querySelectorAll((PAGE ? "#s-arch, " : "") + "#s-sum, " + (PAGE ? "#s-prob, " : "") + kinds().map(([k]) => "#s-" + k).join(", "));
  const tmp = document.createElement("div"); tmp.innerHTML = description();
  old[0].before(...tmp.children); old.forEach((n) => n.remove());
  const r = document.querySelector(".rail"); const fresh = document.createElement("div");
  fresh.innerHTML = V === "d" ? railD() : rail(V === "b", true);
  r.querySelector(".toc").replaceWith(fresh.querySelector(".toc"));
  document.getElementById("hits").innerHTML = hitsLine();
  if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
  wire(); if (inp) { const i = document.getElementById("q"); i.focus(); i.setSelectionRange(pos, pos); }
}
let io;
function spy() {
  io && io.disconnect();
  const links = [...document.querySelectorAll(".toc a[data-s]")].filter((a) => document.getElementById(a.dataset.s));
  /* D: a rail link into the other tab switches it, then jumps. */
  document.querySelectorAll(".toc a[data-goto]").forEach((a) => a.onclick = (e) => {
    if (a.dataset.goto === TAB) return;
    e.preventDefault(); TAB = a.dataset.goto; render();
    document.getElementById(a.dataset.s)?.scrollIntoView({ behavior: "instant" });
  });
  io = new IntersectionObserver((es) => {
    const vis = [...document.querySelectorAll(links.map((a) => "#" + a.dataset.s).join(","))]
      .filter((el) => el.getBoundingClientRect().top < window.innerHeight * 0.35);
    const cur = vis.at(-1)?.id ?? links[0]?.dataset.s;
    links.forEach((a) => a.classList.toggle("on", a.dataset.s === cur));
  }, { root: document.getElementById("main"), threshold: [0, 1], rootMargin: "0px 0px -60% 0px" });
  links.forEach((a) => { const el = document.getElementById(a.dataset.s); el && io.observe(el); });
  const upd = () => { if (!links.length) return; const vis = [...document.querySelectorAll(links.map((a) => "#" + a.dataset.s).join(","))].filter((el) => el.getBoundingClientRect().top < window.innerHeight * 0.35); const cur = vis.at(-1)?.id ?? links[0]?.dataset.s; links.forEach((a) => a.classList.toggle("on", a.dataset.s === cur)); };
  document.getElementById("main").onscroll = upd; upd();
}
function wire() {
  /* D only: repository links open the repo page, the SHOP links the project. */
  const nav = (slug) => (e) => { e.preventDefault(); if (V !== "d") return; PAGE = slug; TAB = slug ? "desc" : "ov"; Q = ""; render(); document.getElementById("main").scrollTo({ top: 0, behavior: "instant" }); };
  document.querySelectorAll("[data-repo]").forEach((a) => a.onclick = nav(a.dataset.repo));
  document.querySelectorAll("[data-proj]").forEach((a) => a.onclick = nav(null));
  const inp = document.getElementById("q");
  if (inp) {
    inp.oninput = () => setQ(inp.value);
    inp.onkeydown = (e) => { if (e.key === "Escape") { setQ(""); inp.blur(); } };
  }
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { TAB = b.dataset.tab; render(); });
  spy();
}
document.querySelectorAll("[data-v]").forEach((b) => b.onclick = () => {
  V = b.dataset.v; document.querySelectorAll("[data-v]").forEach((x) => x.setAttribute("aria-pressed", x === b)); render();
  document.getElementById("main").scrollTop = 0;
});
document.addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement?.id !== "q") { const i = document.getElementById("q"); if (i) { e.preventDefault(); i.focus(); } } });
render();
</script>
