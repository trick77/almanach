openapi: 3.1.0

info:
  title: Almanach API
  # The CONTRACT's version, not the binary's.
  version: 1.0.0
  description: |
    Almanach is the living wiki noergler feeds: one scratch note per merged
    pull request comes in, a repository description and a project description
    come out, rewritten revision by revision by a model call, never edited by
    hand. Everything is German.

    ## Two surfaces

    - `POST /webhooks/noergler` and `GET /auth/ping` take a bearer token. The
      token is the whole identity: it names the team, nothing in a body does.
      Tokens live in the team-keys file of the Almanach instance.
    - `/api/...` is the read side for the UI. With `BACKEND_AUTH_MODE=oidc`
      every route under it but `/api/auth/login` and `/api/auth/callback`
      needs the session cookie the OIDC sign-in sets, and answers 401 without
      one; with `none` it is open to whoever reaches it. The reader gates
      nothing; the name goes to the access log. Nothing is written through it
      but the sources. In every mode a POST, PUT, PATCH or DELETE under it
      that carries `Sec-Fetch-Site` must say `same-origin` (or `none`), and
      one that carries only `Origin` must name the request's host (in oidc
      mode also the redirect URL's origin); anything else is
      `403 {"error": "cross-site request refused"}`. In oidc mode a write
      carrying neither header is refused too; in none mode it passes.
    - The two Markdown exports, `GET /api/projects/{key}.md` and
      `GET /api/projects/{key}/repos/{slug}.md`, also take a team bearer in
      oidc mode, read-only: an agent outside a browser has no session. The
      bearer opens nothing else under `/api`.

    ## Delivery dedup

    A note is keyed by `pr_merged_note#<pr_key, lowercased>#<source_commit_sha>`.
    A body with a key seen before answers `202 {"status":"deduped"}` and changes
    nothing: noergler may send a note twice, the first delivery stands.

    Fields may be added; nothing is removed or renamed without a version change.

servers:
  - url: /

# none mode: no credential; oidc mode: the session cookie. The feed routes
# and the sign-in's own two override it.
security:
  - {}
  - session: []

tags:
  - name: feed
    description: What noergler calls.
  - name: wiki
    description: What the UI reads.
  - name: sources
    description: |
      The clones: the projects whose code Almanach clones itself, a Bitbucket
      project (repositories from its REST API) or a static folder
      (repositories entered by hand). The only writes beside the webhook,
      gated like the read routes by the session. Off, every route but the
      list answers 404, when `BACKEND_REPOS_DIR` is unset. A token is sealed
      on the way in and never returned: `has_token` is all a body carries.
  - name: auth
    description: The OIDC sign-in of oidc mode and the UI's session check.
  - name: operations
    description: What a monitoring system scrapes.

paths:
  /metrics:
    get:
      tags: [operations]
      summary: The worker, the poller, the queue and the spend, for a scraper
      description: |
        Prometheus's text format 0.0.4. Open to a direct loopback caller (no
        forwarding header), as kit's probes are, and to the bearer
        `BACKEND_METRICS_TOKEN` names, from anywhere; anyone else, a team's
        bearer included, gets 404: the series carry every project's spend.
        Every value an integer: times unix seconds (0 for none), money
        nano-USD. Series: `almanach_info{version}`, `almanach_queue_notes`,
        `almanach_queue_runs`, `almanach_last_merge_seconds`,
        `almanach_last_sync_seconds`, `almanach_worker_hold_until_seconds`,
        `almanach_worker_hold{cause}` (0 or 1, every cause),
        `almanach_worker_busy_since_seconds`, `almanach_worker_heartbeat_seconds`,
        with the sources on `almanach_poller_heartbeat_seconds`,
        `almanach_poller_cycle_started_seconds`,
        `almanach_poller_next_cycle_seconds`, then
        `almanach_project_info{project_id,project}` and the counters
        `almanach_llm_calls_total{purpose,project_id}`,
        `almanach_llm_cost_nano_usd_total{purpose,project_id}`, by id: a
        key's case may change.
      operationId: metrics
      security:
        - {}
        - metricsToken: []
      responses:
        "200":
          description: The series.
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Not a loopback caller and not the metrics token.
        "500":
          description: The store did not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/ping:
    get:
      tags: [feed]
      summary: Check a team token
      description: noergler calls this at startup; a 401 disables that team's feed there.
      operationId: ping
      security:
        - teamToken: []
      responses:
        "200":
          description: The token is known.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /webhooks/noergler:
    post:
      tags: [feed]
      summary: Deliver one merged PR's note
      description: |
        Strict: an unknown field or a missing required one is a 422 naming it.
        The body is stored whole, lifted into the wiki's rows and queued for
        the consolidation worker.
      operationId: deliverNote
      security:
        - teamToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteDelivery"
      responses:
        "202":
          description: Accepted, or a duplicate of an earlier delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The project belongs to another team and `BACKEND_TEAM_CLAIMS` is
            `enforce`; nothing is stored, not even the delivery id, so the
            sender keeps the note pending and a resend lands once the
            team-keys file lists the project for the sender.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Body over one megabyte.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The body is not a note; `error` names the field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The note could not be stored. Send it again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/projects:
    get:
      tags: [wiki]
      summary: Every project with a note
      description: One row per project a note has arrived for, with counts and the current revision.
      operationId: listProjects
      responses:
        "200":
          description: Projects, newest merge first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Projects"
        "401":
          $ref: "#/components/responses/SignInRequired"

  /api/queue:
    get:
      tags: [wiki]
      summary: What the worker does now, takes next and finished lately
      description: |
        Every model call goes through one worker, one at a time. `current` is
        the note or run step in flight, null while the worker waits. `next`
        is the rest in the order the worker takes it: the notes it may fold,
        oldest first; the started run's next step; the notes waiting for that
        run; the queued runs, oldest first. Why the worker does not take an
        item yet is on that item: a hold on the first one, a run step waiting
        for its clone or git on that run. `recent` is what it finished in the
        last 24 hours, `spent` what its own calls cost in that window.
      operationId: getQueue
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "401":
          $ref: "#/components/responses/SignInRequired"

  /api/queue/count:
    get:
      tags: [wiki]
      summary: How many notes and runs are queued
      description: The unfolded notes and the open runs, counted; the nav polls it from every page, so none of the queue page's reads.
      operationId: getQueueCount
      responses:
        "200":
          description: The count.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer
        "401":
          $ref: "#/components/responses/SignInRequired"

  /api/projects/{key}:
    get:
      tags: [wiki]
      summary: A project's description, repositories, problem areas and recent notes
      description: The project page. `description` is null until the first fold wrote a revision.
      operationId: getProject
      parameters:
        - $ref: "#/components/parameters/projectKey"
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{key}.md:
    get:
      tags: [wiki]
      summary: A project's page as Markdown
      description: |
        The current revision as one Markdown file, for a coding agent to
        pull into its context: the title and revision, the summary under
        `## Überblick`, the architecture overview as a fenced JSON block, then the
        statements grouped by
        kind in the order invariants, interfaces, rules, decisions,
        pitfalls, extensions, components, flows, entities, each with its files and PR keys
        and its diagram as a fenced JSON block. A kind without statements
        has no heading. Markdown is the frame; a statement's text and the
        summary go in as stored, in their layout (paragraphs, `- ` and
        `N. ` list items, `**bold**`, code spans, sub-headings a level
        under their text's own: a statement's `#### `, the summary's
        `### `), indents dropped and any other line that would read
        as a heading, quote, fence, list, rule, underline or HTML escaped
        with a backslash. A project
        without a revision yet answers 200 with its title and a line saying
        so; a project of one (one source repository) answers its
        repository's export.
        A key that itself ends in `.md` and is listed keeps its JSON
        route; its export is `{key}.md.md`. In oidc mode a team bearer opens
        this route (and the repository's export) read-only, GET and HEAD,
        and is always served the export; nothing else under `/api`.
      operationId: getProjectMarkdown
      security:
        - {}
        - session: []
        - teamToken: []
      parameters:
        - $ref: "#/components/parameters/projectKey"
      responses:
        "200":
          description: The page as Markdown.
          content:
            text/markdown:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{key}/problems:
    get:
      tags: [wiki]
      summary: Problem areas of a project
      description: |
        Bugfix notes of the window grouped by repository and the shared
        directory of the bugfix's component files, never by the model's
        wording of the component name.
      operationId: getProblems
      parameters:
        - $ref: "#/components/parameters/projectKey"
        - name: days
          in: query
          description: Window in days; the instance default when absent.
          schema:
            type: integer
            minimum: 1
            maximum: 3650
      responses:
        "200":
          description: The areas, most bugfixes first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problems"
        "400":
          description: days out of range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{key}/repos/{slug}:
    get:
      tags: [wiki]
      summary: A repository's description, revisions and notes
      description: The repository page with its revision history, newest first, and its notes.
      operationId: getRepo
      parameters:
        - $ref: "#/components/parameters/projectKey"
        - $ref: "#/components/parameters/repoSlug"
      responses:
        "200":
          description: The repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoDetail"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{key}/repos/{slug}.md:
    get:
      tags: [wiki]
      summary: A repository's page as Markdown
      description: |
        The repository's current revision as one Markdown file, framed as
        the project's export (no map), closed by an `Abhängigkeiten`
        section when it uses or is used by another source repository. A slug that itself ends in `.md` and
        is listed keeps its JSON route; its export is `{slug}.md.md`. In
        oidc mode a team bearer opens it read-only, the same token the
        webhook takes.
      operationId: getRepoMarkdown
      security:
        - {}
        - session: []
        - teamToken: []
      parameters:
        - $ref: "#/components/parameters/projectKey"
        - $ref: "#/components/parameters/repoSlug"
      responses:
        "200":
          description: The page as Markdown.
          content:
            text/markdown:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{key}/repos/{slug}/notes/{pr}:
    get:
      tags: [wiki]
      summary: One merged PR's note
      description: The note as noergler sent it, the facts beside it and the gateway figures of the call that wrote it.
      operationId: getNote
      parameters:
        - $ref: "#/components/parameters/projectKey"
        - $ref: "#/components/parameters/repoSlug"
        - name: pr
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The note with its facts and the recorded note call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDetail"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{key}/revisions/{n}:
    get:
      tags: [wiki]
      summary: One revision of a project's page, with what it changed
      description: >-
        The project page as it stood at revision `n`: its summary and
        statements, and the diff against revision `n-1` by statement id
        (added, changed, dropped; all added on the first). The sources on
        each statement say which pull request or run wrote it. A project
        of one has no project page and answers 404.
      operationId: getProjectRevision
      parameters:
        - $ref: "#/components/parameters/projectKey"
        - $ref: "#/components/parameters/revisionNumber"
      responses:
        "200":
          description: The revision with its diff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionDetail"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{key}/repos/{slug}/revisions/{n}:
    get:
      tags: [wiki]
      summary: One revision of a repository's page, with what it changed
      description: >-
        The repository page as it stood at revision `n` and the diff
        against revision `n-1` by statement id, as the project's.
      operationId: getRepoRevision
      parameters:
        - $ref: "#/components/parameters/projectKey"
        - $ref: "#/components/parameters/repoSlug"
        - $ref: "#/components/parameters/revisionNumber"
      responses:
        "200":
          description: The revision with its diff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionDetail"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/dependencies:
    get:
      tags: [wiki]
      summary: Which source repository uses which
      description: >-
        The dependency graph over the source repositories, joined at read
        time from the build manifests the poller read after each sync
        (go.mod, pom.xml, package.json, a Gradle build's build and
        settings files, gradle.properties and gradle/libs.versions.toml,
        pyproject.toml, requirements files, Cargo.toml, at the root or one
        level down, and in every folder a build or workspace declares):
        what one requires against what another provides, every scope, each
        edge naming its own. Never stored, never a model's. A coordinate
        two repositories provide gives no edge and is listed under
        `ambiguous`. Empty with the sources off.
      operationId: getDependencies
      responses:
        "200":
          description: The graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dependencies"
        "401":
          $ref: "#/components/responses/SignInRequired"

  /api/costs:
    get:
      tags: [wiki]
      summary: What Almanach's own model calls cost, by month and project
      description: >-
        Almanach's ledger (`llm_calls`) alone, never noergler's figures: the
        merges (a note's fold) apart from the runs (every baseline call), by
        UTC month and project, newest month first, with the calls no one
        priced counted apart. Beside it what the UTC day's calls cost so far
        and the daily budget (`BACKEND_DAILY_BUDGET_USD`), when one is set.
      operationId: getCosts
      responses:
        "200":
          description: The ledger by month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Costs"
        "401":
          $ref: "#/components/responses/SignInRequired"

  /api/search:
    get:
      tags: [wiki]
      summary: The pages whose text holds a phrase
      description: >-
        One phrase, case folded the Unicode way, over every served page's
        summary and statements (name, text, area, files), matched in the
        server, nothing indexed. A page is answered with the statements
        that matched in its order and a snippet of the text around the
        first hit (the summary's as `summary`, a statement's as
        `snippet`; empty when only its name, area or a file matched). The
        pages come in the store's order, a project's page before its
        repositories'; a project of one has no project page here and its
        repository's page says `single`. The phrase's spaces are
        collapsed, as the texts' are; one under two characters or past
        two hundred answers no pages. Past fifty pages the rest are counted in
        `more`. Link a hit as
        `/projects/{project_key}[/repos/{repo_slug}]#description/{id}`.
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The hits, grouped by page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "401":
          $ref: "#/components/responses/SignInRequired"

  /api/sources:
    get:
      tags: [sources]
      summary: Every source with its repositories counted by state
      description: Answers with enabled false and no sources when the feature is off.
      operationId: listSources
      responses:
        "200":
          description: Sources by key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sources"
        "401":
          $ref: "#/components/responses/SignInRequired"
    post:
      tags: [sources]
      summary: Create a source
      description: |
        A Bitbucket source needs `host`; a static one must not have one.
        A Bitbucket source's `project_key` is a Bitbucket project key (a letter,
        then letters, digits, underscore), else a 422; one noergler already
        delivers in another case is stored in noergler's spelling. A static
        key spelled otherwise than noergler's is a 422 naming that spelling.
        `token_auth` defaults to bearer for Bitbucket and basic for static;
        `token_user` goes with basic only. A token needs `BACKEND_SOURCE_TOKEN_KEY`
        on the instance. The next sync cycle starts at once.
      operationId: createSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSource"
      responses:
        "201":
          description: The source as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDetail"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          $ref: "#/components/responses/SourcesOff"
        "409":
          description: A source with this key exists, or another project had the key, in any case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/NotJSON"
        "422":
          $ref: "#/components/responses/Invalid"

  /api/sources/{key}:
    get:
      tags: [sources]
      summary: One source with its repositories
      description: The source, its folder and size on disk, and every repository row with its state.
      operationId: getSource
      parameters:
        - $ref: "#/components/parameters/projectKey"
      responses:
        "200":
          description: The source, its folder and every repository row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDetail"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [sources]
      summary: Change a source's host or token, or rename its project
      description: >-
        Every field is optional; an omitted `token` keeps the stored one, an empty one clears it. A token reaches
        one host only: on a static source whose repositories span more than one host, a new token, or a changed
        `token_auth` or `token_user` with a token stored, is a 422 naming the field and the hosts; clearing is not.
        `project_key` renames the project, a change of case included: it keeps its pages, notes and clones, and the
        old key stays a name of it (every route still answers under it, with the current key in the body). A key
        another project ever had, in any case, is a 409. A rename comes alone: a changed `project_key` with any
        other field is a 422; an unchanged one is no rename. A Bitbucket source changes case only, another key is a
        422: its key is its Bitbucket project's, the one the listing reads and noergler's notes are filed under.
      operationId: updateSource
      parameters:
        - $ref: "#/components/parameters/projectKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceAccess"
      responses:
        "200":
          description: The source as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDetail"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another project had this key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/NotJSON"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      tags: [sources]
      summary: Remove a source, its repositories and its folder on disk
      description: The folder goes first, then the rows; descriptions from PR notes are untouched.
      operationId: deleteSource
      parameters:
        - $ref: "#/components/parameters/projectKey"
      responses:
        "204":
          description: Gone, clones included.
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sources/{key}/sync:
    post:
      tags: [sources]
      summary: Queue every repository of a source for the next cycle, and start it
      description: A Bitbucket source is listed again first. Missing rows stay missing.
      operationId: syncSource
      parameters:
        - $ref: "#/components/parameters/projectKey"
      responses:
        "202":
          description: Queued; `repos` is how many rows moved to pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queued"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sources/{key}/repos:
    post:
      tags: [sources]
      summary: Add a repository to a static source
      description: >-
        A Bitbucket source lists its repositories itself and answers 422. A static source holds one host: a
        `clone_url` on another scheme, host or port than its repositories' (the default port aside) is a 422,
        and so is any on a source that already spans several, which the message lists.
      operationId: addSourceRepo
      parameters:
        - $ref: "#/components/parameters/projectKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSourceRepo"
      responses:
        "201":
          description: The source with the new row, pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDetail"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            A repository with this slug exists, another repository of the
            project had the slug, in any case, or another source clones the
            URL already (scheme, host and path compared without case, a
            trailing `.git` or slash), which the message names: a
            repository is cloned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/NotJSON"
        "422":
          $ref: "#/components/responses/Invalid"

  /api/sources/{key}/repos/{slug}:
    patch:
      tags: [sources]
      summary: Rename a hand-entered repository
      description: >-
        A new slug and, optionally, a new clone URL (the next cycle re-clones). The repository keeps its pages,
        notes and runs; the old slug stays a name of it. A listed repository follows its name in Bitbucket and
        answers 422.
      operationId: renameSourceRepo
      parameters:
        - $ref: "#/components/parameters/projectKey"
        - $ref: "#/components/parameters/repoSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameSourceRepo"
      responses:
        "200":
          description: The source as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDetail"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            Another repository of the project had this slug, in any case, a
            new clone URL while a run of this repository is open, or a clone
            URL another source clones already, which the message names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/NotJSON"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      tags: [sources]
      summary: Remove one repository and its clone
      description: The clone goes first, then the row. A listed repository returns with the next listing.
      operationId: deleteSourceRepo
      parameters:
        - $ref: "#/components/parameters/projectKey"
        - $ref: "#/components/parameters/repoSlug"
      responses:
        "204":
          description: Gone, clone included.
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sources/{key}/repos/{slug}/sync:
    post:
      tags: [sources]
      summary: Queue one repository for the next cycle, and start it
      description: Marks the row pending and nudges the poller.
      operationId: syncSourceRepo
      parameters:
        - $ref: "#/components/parameters/projectKey"
        - $ref: "#/components/parameters/repoSlug"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queued"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sources/{key}/repos/{slug}/describe:
    post:
      tags: [sources]
      summary: Queue a baseline run of one repository
      description: >-
        Reads the clone at its head and folds what the code teaches into the
        repository's page. reconcile (the default) reads what changed since
        the commit last documented, or everything before the first run; full
        reads the repository afresh with a new catalogue. Wakes the worker.
      operationId: describeSourceRepo
      parameters:
        - $ref: "#/components/parameters/projectKey"
        - $ref: "#/components/parameters/repoSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Describe"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Described"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The repository has an open run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          $ref: "#/components/responses/NotJSON"
        "422":
          $ref: "#/components/responses/Invalid"

  /api/sources/{key}/repos/{slug}/brief:
    get:
      tags: [sources]
      summary: One repository's brief with its file
      description: >-
        The repository's .agents/PROJECT.md as last written: what an agent
        working in the repository cannot read from its code, for its
        AGENTS.md. The source page reads it when a push was refused, for the
        reader to copy.
      operationId: getSourceRepoBrief
      parameters:
        - $ref: "#/components/parameters/projectKey"
        - $ref: "#/components/parameters/repoSlug"
      responses:
        "200":
          description: The brief.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefText"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [sources]
      summary: Queue one repository's brief
      description: >-
        The worker writes the brief from the repository's stored page (one
        model call, no code read) and pushes it as .agents/PROJECT.md to the
        branch feature/repository-description-update, on top of the default
        branch, with the source's token. A push the forge refuses (no write
        access, a token expired) leaves the text to copy. A request already
        waiting keeps its place. Wakes the worker.
      operationId: requestSourceRepoBrief
      parameters:
        - $ref: "#/components/parameters/projectKey"
        - $ref: "#/components/parameters/repoSlug"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queued"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"

  /api/sources/{key}/repos/{slug}/deactivate:
    post:
      tags: [sources]
      summary: Deactivate one repository
      description: >-
        Takes the repository out without removing its row, so a listing never
        adds it back. At once: its clone is removed, its queued runs and
        manifests go, its notes are ignored, its page leaves the wiki. The
        project page is the worker's: a departure run, queued when the project
        has a page, takes the repository off the system map and has the model
        rewrite what still names it. Deactivating a deactivated repository
        changes nothing.
      operationId: deactivateSourceRepo
      parameters:
        - $ref: "#/components/parameters/projectKey"
        - $ref: "#/components/parameters/repoSlug"
      responses:
        "200":
          description: The source as it stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDetail"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A run of the repository is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/sources/{key}/repos/{slug}/activate:
    post:
      tags: [sources]
      summary: Activate a deactivated repository again
      description: >-
        A source again: cloned by the next cycle (nudged), its kept page back
        in the wiki, its first run reconciling from the commit last
        documented. A queued departure run is dropped. Activating an active
        repository changes nothing.
      operationId: activateSourceRepo
      parameters:
        - $ref: "#/components/parameters/projectKey"
        - $ref: "#/components/parameters/repoSlug"
      responses:
        "200":
          description: The source as it stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDetail"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/CrossSite"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Its departure run is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/me:
    get:
      tags: [auth]
      summary: Who reads
      description: >-
        The UI's session check, made before anything renders. In every mode;
        401 only in oidc mode without a session.
      operationId: me
      responses:
        "200":
          description: The mode and the reader.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/SignInRequired"

  /api/auth/login:
    get:
      tags: [auth]
      summary: Start the OIDC sign-in
      description: >-
        Redirects to the provider, state, nonce and a PKCE verifier in
        short-lived cookies, `next` in the `almanach_next` cookie (10 minutes).
        A browser navigates here; a fetch cannot follow. While the provider
        has not answered discovery, to `/?auth_error=provider_unavailable`;
        once it answered in disagreement with the configuration (an issuer
        mismatch, a 4xx, no discovery document), to
        `/?auth_error=provider_misconfigured` until a restart. The callback
        lands on the same two.
      operationId: login
      security: []
      parameters:
        - name: next
          in: query
          description: >-
            The page to return to after the sign-in: a path on this site
            (one leading slash, no scheme, host, backslash or control
            character); anything else is `/`.
          schema:
            type: string
      responses:
        "302":
          description: To the provider, or to `/?auth_error=provider_unavailable` or `provider_misconfigured`.
        "503":
          $ref: "#/components/responses/SignInOff"

  /api/auth/callback:
    get:
      tags: [auth]
      summary: Finish the OIDC sign-in
      description: >-
        Where the provider returns. State, PKCE, the ID token and its nonce are
        checked; the claims become the signed session cookie and the browser
        goes to the page `next` named at the login, else `/`. On any failure
        to `/?auth_error=…`, the reason in the server log only.
      operationId: callback
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302":
          description: To the `next` page signed in, or to `/?auth_error=…`.
        "503":
          $ref: "#/components/responses/SignInOff"

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Sign out
      description: >-
        Clears the session cookie; nothing is stored server-side. The
        provider's own session lives on, so the UI goes where `redirect_url`
        says and halts there.
      operationId: logout
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Logout"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          $ref: "#/components/responses/CrossSite"
        "503":
          $ref: "#/components/responses/SignInOff"

components:
  securitySchemes:
    teamToken:
      type: http
      scheme: bearer
      description: The team's token from the instance's team-keys file.
    metricsToken:
      type: http
      scheme: bearer
      description: BACKEND_METRICS_TOKEN, for /metrics only; no team's token opens it.
    session:
      type: apiKey
      in: cookie
      name: almanach_session
      description: The signed session the OIDC callback sets, oidc mode only. 30 days.

  parameters:
    projectKey:
      name: key
      in: path
      required: true
      schema:
        type: string
    repoSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    revisionNumber:
      name: n
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    Unauthorized:
      description: No bearer, or one no team owns.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown project, repository, note or source.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SourcesOff:
      description: The feature is off (`BACKEND_REPOS_DIR` unset).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotJSON:
      description: The body is not `application/json`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Invalid:
      description: A field is wrong; `error` names it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SignInRequired:
      description: oidc mode only, without a valid session; the UI navigates to the login.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CrossSite:
      description: >-
        A change that did not come from Almanach's own pages (Sec-Fetch-Site,
        else Origin), in every mode; in oidc mode also a write carrying
        neither header.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SignInOff:
      description: none mode has no sign-in.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Me:
      type: object
      required: [mode, user]
      properties:
        mode:
          type: string
          enum: [none, oidc]
        user:
          type: string
          description: The reader (preferred username, else email, else subject); empty in none mode.

    Logout:
      type: object
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          description: Where the browser goes next, `/?signed_out=1`.

    Costs:
      type: object
      required: [months, today]
      properties:
        months:
          type: array
          description: The last twelve UTC months, newest first; a month without a call is absent.
          items:
            type: object
            required: [month, calls, projects]
            properties:
              month:
                type: string
                description: YYYY-MM, UTC.
              cost_usd:
                type: string
                description: 3 decimals; omitted when no call of the month was priced.
              calls:
                type: integer
              projects:
                type: array
                items:
                  type: object
                  required: [project, calls, merges, runs, briefs]
                  properties:
                    project:
                      type: string
                    cost_usd:
                      type: string
                    calls:
                      type: integer
                    merges:
                      $ref: "#/components/schemas/CostSum"
                    runs:
                      $ref: "#/components/schemas/CostSum"
                    briefs:
                      description: The repositories' PROJECT.md calls.
                      $ref: "#/components/schemas/CostSum"
        budget_usd:
          type: string
          description: BACKEND_DAILY_BUDGET_USD, 3 decimals; omitted when none is set.
        today:
          type: object
          description: What the calls of the UTC day cost so far.
          required: [calls]
          properties:
            cost_usd:
              type: string
            calls:
              type: integer

    CostSum:
      type: object
      description: Calls of one kind and what they cost.
      required: [calls, unpriced]
      properties:
        calls:
          type: integer
        unpriced:
          type: integer
          description: Calls no one priced; their cost is unknown, not zero.
        cost_usd:
          type: string
          description: 3 decimals; omitted when none was priced.

    Sources:
      type: object
      required: [enabled, default_host, max_calls, sources]
      properties:
        enabled:
          type: boolean
        default_host:
          type: string
          description: BACKEND_BITBUCKET_HOST, the host a new Bitbucket source starts with; empty when unset or the feature is off.
        max_calls:
          type: integer
          description: BACKEND_BASELINE_MAX_CALLS, the model calls one baseline run may make; every repository of a new source gets a full run. 0 with the feature off.
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceSummary"

    SourceSummary:
      type: object
      required: [project_key, kind, host, has_token, token_auth, token_user, repos, ready, active, failed, missing, inactive, last_listed_at, last_synced_at, last_error, created_at, updated_at]
      properties:
        project_key:
          type: string
        kind:
          type: string
          enum: [bitbucket, static]
        host:
          type: string
          description: The Bitbucket base URL; empty for a static source.
        has_token:
          type: boolean
        token_auth:
          type: string
          enum: [bearer, basic]
        token_user:
          type: string
        repos:
          type: integer
        ready:
          type: integer
          description: Ready and not deactivated; active and failed count the same way.
        active:
          type: integer
          description: Pending or syncing.
        failed:
          type: integer
        missing:
          type: integer
        inactive:
          type: integer
          description: Deactivated.
        last_listed_at:
          type: [string, "null"]
          format: date-time
        last_synced_at:
          type: [string, "null"]
          format: date-time
          description: The newest sync of any of its repositories, null before the first.
        last_error:
          type: string
          description: The last listing's failure, or empty.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SourceDetail:
      type: object
      required: [project_key, kind, host, has_token, token_auth, token_user, dir, disk_bytes, last_listed_at, last_error, created_at, updated_at, repos, max_calls]
      properties:
        max_calls:
          type: integer
          description: BACKEND_BASELINE_MAX_CALLS, the model calls one run may make; what a full run may cost.
        project_key:
          type: string
        kind:
          type: string
          enum: [bitbucket, static]
        host:
          type: string
        has_token:
          type: boolean
        token_auth:
          type: string
          enum: [bearer, basic]
        token_user:
          type: string
        dir:
          type: string
          description: The project's folder under the base.
        disk_bytes:
          type: integer
        last_listed_at:
          type: [string, "null"]
          format: date-time
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        repos:
          type: array
          items:
            $ref: "#/components/schemas/SourceRepo"

    SourceRepo:
      type: object
      required: [slug, clone_url, origin, branch, head_commit, state, last_synced_at, last_error, created_at, deactivated_at, dir, baseline, brief]
      properties:
        slug:
          type: string
        clone_url:
          type: string
        origin:
          type: string
          enum: [listed, manual]
        dir:
          type: string
          description: The clone's folder, named by the project's and the repository's ids, never by their names.
        branch:
          type: string
          description: Empty until resolved from the remote.
        head_commit:
          type: string
        state:
          type: string
          enum: [pending, syncing, ready, failed, missing]
        last_synced_at:
          type: [string, "null"]
          format: date-time
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        deactivated_at:
          type: [string, "null"]
          format: date-time
          description: >-
            When the repository was deactivated, null while it is a source. A
            deactivated repository stays on the source (a listing never adds
            it back) but is no source anywhere: no clone, no run, its notes
            ignored, its page out of the wiki.
        baseline:
          oneOf:
            - $ref: "#/components/schemas/Baseline"
            - type: "null"
        brief:
          description: The repository's brief, null before the first request.
          oneOf:
            - $ref: "#/components/schemas/Brief"
            - type: "null"

    Brief:
      type: object
      description: >-
        A repository's .agents/PROJECT.md. state is the newest thing that
        happened: a request waiting, a request failed (error says why), the
        push due, done, not needed (the default branch holds the file) or
        refused (error says why; the text is there to copy).
      required: [state, waiting, error, has_text, page_revision, written_at, branch, pushed_commit, push_at]
      properties:
        state:
          type: string
          enum: [requested, failed, pushing, pushed, unchanged, push_failed]
        waiting:
          type: string
          enum: ["", budget]
          description: >-
            Why a request is not taken yet: budget, the day's
            BACKEND_DAILY_BUDGET_USD is spent and the worker takes it the next
            UTC day.
        error:
          type: string
        has_text:
          type: boolean
        page_revision:
          type: integer
          description: The page revision the brief was written from, 0 before the first.
        written_at:
          type: [string, "null"]
          format: date-time
        branch:
          type: string
        pushed_commit:
          type: string
          description: >-
            The commit last pushed to the branch, kept through later states. A
            push replaces the branch only while it still stands there; one
            holding commits of anyone else is refused.
        push_at:
          type: [string, "null"]
          format: date-time

    BriefText:
      allOf:
        - $ref: "#/components/schemas/Brief"
        - type: object
          required: [markdown, path]
          properties:
            markdown:
              type: string
            path:
              type: string
              description: Where the file goes in the repository.

    Queue:
      type: object
      description: The worker's queue.
      required: [current, next, sync, spent, recent, failed, poll_seconds, max_attempts, more]
      properties:
        current:
          description: The note or run step in flight; null while the worker waits.
          oneOf:
            - $ref: "#/components/schemas/QueueItem"
            - type: "null"
        next:
          type: array
          description: The rest, in the order the worker takes it.
          items:
            $ref: "#/components/schemas/QueueItem"
        sync:
          description: The poller's sync cycle; null with the sources off.
          oneOf:
            - $ref: "#/components/schemas/SyncCycle"
            - type: "null"
        spent:
          type: object
          description: What the worker's own calls of the last 24 hours cost.
          required: [calls]
          properties:
            cost_usd:
              type: string
              description: 3 decimals; omitted when none was priced.
            calls:
              type: integer
        recent:
          type: array
          description: What the worker finished in the last 24 hours, newest first, at most 50.
          items:
            $ref: "#/components/schemas/QueueRecent"
        failed:
          type: array
          description: |
            The notes the merge call failed on, newest first, at most 50: off
            the queue with their reason until the next run of their
            repository ends done, which queues them again, or for good once
            given up at `max_attempts`.
          items:
            $ref: "#/components/schemas/QueueFailed"
        poll_seconds:
          type: integer
          description: How often the worker looks on its own; a note's webhook wakes it at once.
        max_attempts:
          type: integer
          description: The attempt an item is given up at.
        more:
          type: integer
          description: Items queued past the listed ones; `next` lists at most 100 notes.

    QueueItem:
      type: object
      description: >-
        A note or a run, with what it waits for; as the current item also a
        repository's brief (its call or its push), never queued here.
      required: [kind, project, repo, attempts]
      properties:
        kind:
          type: string
          enum: [note, run, brief]
        project:
          type: string
        repo:
          type: string
        pr_key:
          type: string
          description: A note's.
        title:
          type: string
          description: A note's PR title.
        change_kind:
          type: string
          description: A note's.
        received_at:
          type: string
          format: date-time
          description: A note's.
        held_by:
          type: integer
          description: The run of the note's repository it waits for; omitted when none.
        due_at:
          type: string
          format: date-time
          description: When the note's repository is folded, its oldest note's arrival plus BACKEND_FOLD_DELAY; set while it waits for that, omitted otherwise.
        batch:
          type: integer
          description: How many notes the fold in flight takes in one call; on the current item, when more than one.
        run:
          $ref: "#/components/schemas/QueueRun"
        attempts:
          type: integer
          description: Calls the endpoint failed so far; at `max_attempts` the item is given up.
        since:
          type: string
          format: date-time
          description: When the worker took it; on the current item only.
        wait:
          type: object
          description: Why the worker does not take it yet.
          required: [reason]
          properties:
            reason:
              type: string
              enum: [timeout, rate_limit, key_refused, unavailable, busy, write, clone_busy, placing, budget]
              description: A hold of the whole worker (the first six, `until` set; `write` is the store refusing writes, a full disk) or a run step that waits (`since` set; `budget` is the day's budget spent, every run but a departure waits for the next UTC day).
            until:
              type: string
              format: date-time
            since:
              type: string
              format: date-time

    QueueRun:
      type: object
      description: An open run with its steps.
      required: [id, state, mode, trigger, commit, base_commit, calls, queued_at, started_at, steps]
      properties:
        id:
          type: integer
        state:
          type: string
          enum: [queued, cataloguing, describing, project]
        mode:
          type: string
          enum: [full, reconcile, restyle]
          description: restyle reads no code, the stored pages alone, for a prompt epoch they are not at (trigger epoch); it documents nothing.
        trigger:
          type: string
          enum: [manual, first_ready, monthly, retry, departure, epoch]
        commit:
          type: string
        base_commit:
          type: string
        calls:
          type: integer
        queued_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        cost_usd:
          type: string
          description: 3 decimals; omitted when none of its calls was priced.
        steps:
          type: array
          description: The catalogue, the overview, the subjects in reading order, the project, the repository map; a queued run lists the catalogue, the project and the map alone. A restyle lists the repository page's restyle, the project page's and the map.
          items:
            type: object
            required: [kind, name, files, bytes, state, skip, calls, failed, at]
            properties:
              kind:
                type: string
                enum: [catalogue, overview, subject, project, repo_map, restyle, project_restyle]
              name:
                type: string
                description: A subject's name, empty otherwise.
              files:
                type: integer
              bytes:
                type: integer
              state:
                type: string
                enum: [done, skipped, current, todo]
              skip:
                type: string
                enum: ["", gone, calls, bytes, failed, refused, no_page]
              calls:
                type: integer
              failed:
                type: integer
              at:
                type: [string, "null"]
                format: date-time
                description: The step's last call.
              cost_usd:
                type: string

    SyncCycle:
      type: object
      required: [running, done, total, finished_at, next_at]
      properties:
        running:
          type: boolean
        project:
          type: string
          description: The repository being synced, while running.
        repo:
          type: string
        repo_since:
          type: string
          format: date-time
        done:
          type: integer
        total:
          type: integer
        finished_at:
          type: [string, "null"]
          format: date-time
        next_at:
          type: [string, "null"]
          format: date-time
          description: When the next cycle starts on its own; null with no interval.

    QueueRecent:
      type: object
      required: [kind, at, project, repo]
      properties:
        kind:
          type: string
          enum: [note, run]
        at:
          type: string
          format: date-time
        project:
          type: string
        repo:
          type: string
        pr_key:
          type: string
        title:
          type: string
        outcome:
          type: string
          description: A note's merge call outcome (ok, timed_out, unparseable, too_long, error); omitted when no call was made.
        batch:
          type: integer
          description: How many notes the note's merge call folded, when more than one; cost_usd is then the whole call's, shared with them.
        run_id:
          type: integer
        state:
          type: string
          enum: [done, failed]
        skipped:
          type: integer
        error:
          type: string
        retry_at:
          type: string
          format: date-time
          description: When the poller queues this failed run again at the earliest; on the repository's last run only.
        cost_usd:
          type: string

    QueueFailed:
      type: object
      description: A note the merge call failed on.
      required: [project, repo, pr_key, at, reason, attempts, given_up]
      properties:
        project:
          type: string
        repo:
          type: string
        pr_key:
          type: string
        title:
          type: string
        at:
          type: string
          format: date-time
          description: When the call failed.
        reason:
          type: string
          description: The outcome and the error (unparseable, too_long, error with its cause; a patch refused and why).
        attempts:
          type: integer
          description: Attempts so far, gateway failures included.
        given_up:
          type: boolean
          description: At `max_attempts`; no run queues it again, a new delivery of the note does.

    Baseline:
      type: object
      description: The repository's newest baseline run and the commit last documented.
      required: [run_id, state, map_step, mode, trigger, commit, step, steps, skipped, skipped_parts, read_bytes, readable_bytes, error, queued_at, started_at, finished_at, documented_commit, documented_at, left_parts, auto_retry]
      properties:
        run_id:
          type: integer
        state:
          type: string
          enum: [queued, cataloguing, describing, project, done, failed]
        map_step:
          type: boolean
          description: In state project, the project step is over and the run draws the repository map, its last step.
        mode:
          type: string
          enum: [full, reconcile, restyle]
          description: A restyle shows only while it is open, holding the repository's run; over, the newest reading run shows again.
        trigger:
          type: string
          enum: [manual, first_ready, monthly, retry, departure, epoch]
        commit:
          type: string
          description: The head when queued, pinned when the run starts.
        step:
          type: integer
        steps:
          type: integer
        skipped:
          type: integer
          description: Subjects the run could not fold; the next reconcile reads them again.
        read_bytes:
          type: integer
          description: The distinct file content the run's folded parts read (the docs and the subjects, a file once however many subjects hold it, a skipped part not at all), set when the run ends; a reconcile carries the documented run's.
        readable_bytes:
          type: integer
          description: What the tree offered at the full run's commit, the readable files' bytes (a file over 100 kB counts its head), a reconcile carrying the documented run's; 0 on a restyle, a departure, a run from before. The share of the two is how much of the code the page rests on.
        skipped_parts:
          type: array
          description: The parts the run left out, in the order it hit them; one per part, where skipped counts each time.
          items:
            type: object
            required: [part, name, reason]
            properties:
              part:
                type: string
                enum: [overview, subject, project]
              name:
                type: string
                description: The subject's name, empty for the overview and the project.
              reason:
                type: string
                enum: ["", gone, calls, bytes, failed, refused, no_page]
                description: Why it was left out; empty for a run from before reasons were kept.
        cost_usd:
          type: string
          description: What the run's priced calls cost, 3 decimals; omitted when none was priced.
        error:
          type: string
        queued_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        documented_commit:
          type: string
          description: The commit of the newest done run, empty before one.
        documented_at:
          type: [string, "null"]
          format: date-time
        left_parts:
          type: boolean
          description: The done run skipped a part worth reading again (any but a subject gone or a project left unchanged without a page), the rule the poller retries by.
        auto_retry:
          type: boolean
          description: left_parts, and the poller reads them again on its own, a day after the run ended or the reconcile interval when shorter (the interval on, fewer than three retries in a row, the head the documented commit); false, only the next run or a button does.

    Describe:
      type: object
      properties:
        mode:
          type: string
          enum: [reconcile, full]

    Described:
      type: object
      required: [status, run_id, mode]
      properties:
        status:
          type: string
          const: queued
        run_id:
          type: integer
        mode:
          type: string
          enum: [reconcile, full]

    NewSource:
      type: object
      required: [kind]
      properties:
        project_key:
          type: string
          description: >-
            One path segment, Bitbucket's charset. Required, but for a static
            folder created with its first repository: empty is then the
            repository's slug.
        kind:
          type: string
          enum: [bitbucket, static]
        host:
          type: string
        token:
          type: string
          description: Sealed on arrival, never returned.
        token_auth:
          type: string
          enum: [bearer, basic]
        token_user:
          type: string
        clone_url:
          type: string
          description: >-
            A static folder's first repository, created with it in one
            transaction (https, no credentials). A Bitbucket source lists its
            repositories itself: a 422. Another source cloning the URL already
            is a 409.
        slug:
          type: string
          description: The first repository's slug; empty is its name from clone_url (the last path segment, `.git` dropped).
        branch:
          type: string
          description: The first repository's branch; empty resolves the remote's default.

    SourceAccess:
      type: object
      properties:
        project_key:
          type: string
          description: Renames the project, a change of case included. Omitted or unchanged keeps it.
        host:
          type: string
        token:
          type: string
          description: Omitted keeps the stored token; empty clears it.
        token_auth:
          type: string
          enum: [bearer, basic]
        token_user:
          type: string

    NewSourceRepo:
      type: object
      required: [clone_url]
      properties:
        slug:
          type: string
          description: Empty is the repository's name from clone_url (the last path segment, `.git` dropped).
        clone_url:
          type: string
          description: https, no credentials, on the host of the source's other repositories.
        branch:
          type: string
          description: Empty resolves the remote's default branch.

    RenameSourceRepo:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
          description: The new slug, a change of case included.
        clone_url:
          type: string
          description: https, no credentials. Empty keeps the stored one.

    Queued:
      type: object
      required: [status, repos]
      properties:
        status:
          type: string
          const: queued
        repos:
          type: integer

    Ping:
      type: object
      required: [status, team]
      properties:
        status:
          type: string
          const: ok
        team:
          type: string

    Accepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, deduped, ignored]
          description: >-
            ignored is a note for a repository that is no source repository,
            with the sources on; nothing is stored. A note for a project
            another team owns is accepted under `BACKEND_TEAM_CLAIMS=log`
            (stored, a warning logged) and a 403 under `enforce`.

    Money:
      type: [string, "null"]
      description: USD as a decimal string, never a float. Null when the call was unpriced.
      examples: ["0.012"]

    NoteDelivery:
      type: object
      description: What noergler sends at merge. Every field is present; absent values are null.
      additionalProperties: false
      required:
        - event_type
        - project_key
        - repo_slug
        - pr_id
        - pr_key
        - pr_title
        - ticket_key
        - jira_issue_type
        - change_kind
        - reviewed_commit
        - source_commit_sha
        - merge_commit_sha
        - merged_at
        - run_id
        - model_label
        - issues_posted
        - suggestions_posted
        - note
        - claims
        - note_call
        - rounds
        - review_totals
      properties:
        event_type:
          type: string
          const: pr_merged_note
        project_key:
          type: string
        repo_slug:
          type: string
        pr_id:
          type: integer
          minimum: 1
        pr_key:
          type: string
          description: PROJECT/repo#id.
        pr_title:
          type: string
        ticket_key:
          type: [string, "null"]
        jira_issue_type:
          type: [string, "null"]
        change_kind:
          type: [string, "null"]
          enum: [bugfix, feature, refactor, chore, null]
        reviewed_commit:
          type: [string, "null"]
        source_commit_sha:
          type: string
          minLength: 7
        merge_commit_sha:
          type: [string, "null"]
        merged_at:
          type: string
          format: date-time
        run_id:
          type: integer
        model_label:
          type: [string, "null"]
        issues_posted:
          type: integer
        suggestions_posted:
          type: integer
        note:
          $ref: "#/components/schemas/Note"
        claims:
          type: array
          description: The team's ownership of the note's project; a null repo_slug is the whole project.
          items:
            type: object
            required: [project_key, repo_slug]
            properties:
              project_key:
                type: string
              repo_slug:
                type: [string, "null"]
        note_call:
          oneOf:
            - $ref: "#/components/schemas/NoteCall"
            - type: "null"
        rounds:
          type: object
          description: Every note call this PR made, summed.
          required: [count, input_tokens, output_tokens, cost_usd, cost_nano_usd]
          properties:
            count:
              type: integer
            input_tokens:
              type: integer
            output_tokens:
              type: integer
            cost_usd:
              $ref: "#/components/schemas/Money"
            cost_nano_usd:
              type: [integer, "null"]
        review_totals:
          type: object
          description: The PR's review aggregate, kept verbatim in the delivery.

    Note:
      type: object
      description: The validated note as noergler's model wrote it, German.
      required: [summary, change_kind, bugfix, components, rules, invariants, entities]
      properties:
        summary:
          type: [string, "null"]
        change_kind:
          type: string
          enum: [bugfix, feature, refactor, chore]
        bugfix:
          oneOf:
            - type: object
              required: [symptom, cause, cause_kind]
              properties:
                symptom:
                  type: string
                cause:
                  type: string
                cause_kind:
                  type: string
                  enum: [logic, concurrency, config, input_validation, integration, missing_test, other]
            - type: "null"
        components:
          $ref: "#/components/schemas/NoteItems"
        rules:
          $ref: "#/components/schemas/NoteItems"
        invariants:
          $ref: "#/components/schemas/NoteItems"
        entities:
          $ref: "#/components/schemas/NoteItems"

    NoteItems:
      type: array
      items:
        type: object
        required: [name, text, files]
        properties:
          name:
            type: string
          text:
            type: string
          files:
            type: array
            items:
              type: string

    NoteCall:
      type: object
      description: Everything the gateway reported for the round's note call. A lane it did not send is null.
      required: [outcome, note_status]
      properties:
        outcome:
          type: string
        note_status:
          type: string
        profile:
          type: [string, "null"]
        model:
          type: [string, "null"]
        deployment:
          type: [string, "null"]
        reasoning_sent:
          type: [string, "null"]
        finish_reason:
          type: [string, "null"]
        call_id:
          type: [string, "null"]
        litellm_version:
          type: [string, "null"]
        input_tokens:
          type: [integer, "null"]
        input_uncached_tokens:
          type: [integer, "null"]
        cache_read_tokens:
          type: [integer, "null"]
        cache_write_tokens:
          type: [integer, "null"]
        output_tokens:
          type: [integer, "null"]
        reasoning_tokens:
          type: [integer, "null"]
        cost_usd:
          $ref: "#/components/schemas/Money"
        cost_nano_usd:
          type: [integer, "null"]
        cost_input_nano_usd:
          type: [integer, "null"]
        cost_cache_read_nano_usd:
          type: [integer, "null"]
        cost_cache_write_nano_usd:
          type: [integer, "null"]
        cost_output_nano_usd:
          type: [integer, "null"]
        cost_reasoning_nano_usd:
          type: [integer, "null"]
        cost_tool_usage_nano_usd:
          type: [integer, "null"]
        key_spend_usd:
          $ref: "#/components/schemas/Money"
        key_spend_nano_usd:
          type: [integer, "null"]
        headers_ms:
          type: [integer, "null"]
        total_ms:
          type: [integer, "null"]
        warnings:
          type: array
          items:
            type: string

    Projects:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"

    Project:
      type: object
      required: [key, team, repos, notes, revision, summary, last_merge, repo]
      properties:
        key:
          type: string
        team:
          type: string
        repos:
          type: integer
        notes:
          type: integer
        revision:
          type: integer
          description: The project description's current revision, 0 when none.
        summary:
          type: string
          description: >-
            The first sentence of the project description's current
            summary, "" when none. A project of one: its repo's summary.
        last_merge:
          type: [string, "null"]
          format: date-time
        repo:
          description: >-
            The repository of a project of one (a source with one
            repository): its page is the project's. Null for every other
            project, and with the sources off.
          oneOf:
            - $ref: "#/components/schemas/Repo"
            - type: "null"

    Source:
      type: object
      description: >-
        What a statement was learned from or last changed by: a PR (pr_key,
        merged_at) or a baseline run that read the code at a commit (commit,
        committed_at).
      required: [kind]
      properties:
        kind:
          type: string
          enum: [pr, baseline]
        pr_key:
          type: string
        ticket_key:
          type: string
        merged_at:
          type: string
          format: date-time
        commit:
          type: string
          description: >-
            A baseline run's read commit, or a PR's merge commit (absent on
            sources from before it was kept).
        committed_at:
          type: string
          format: date-time
        repo:
          type: string
          description: The repository whose commit a baseline source is.

    Statement:
      type: object
      required: [id, kind, name, text, files, sources, checked, area]
      properties:
        id:
          type: string
        kind:
          type: string
          description: |
            `interface` is a public interface a component offers others (an
            API, events, a library's exported API, a CLI), never the
            component itself; `flow` a flow across components (on a project
            page across repositories) from its trigger to its end;
            `decision` is a choice the code embodies with its stated reason,
            `extension` where and how a kind of change is made (a
            repository's alone, never on a project page), `pitfall` what
            broke before and how not to break it again.
          enum: [component, interface, flow, rule, invariant, entity, decision, extension, pitfall]
        name:
          type: string
        text:
          type: string
          description: |
            Laid-out text: paragraphs a blank line apart, flat `- ` and
            `N. ` list items, `**bold**` within a line, backtick code spans
            and `#### ` sub-headings, one per line. Nothing else is markup.
        files:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
        checked:
          type: string
          description: The commit a baseline run last confirmed the statement against; empty when none has.
        area:
          type: string
          description: |
            The part of the system the statement is about, its sub-chunk
            inside its kind. A page's areas stand in the order of their first
            statement, the same in every kind; empty before the page was laid
            out.
        diagram:
          $ref: "#/components/schemas/Diagram"

    Diagram:
      description: >-
        A picture beside a statement's paragraphs, in rongo's intermediate
        form (ui/src/diagramIR.ts), validated on the way in. Absent when the
        statement has none.
      oneOf:
        - $ref: "#/components/schemas/FlowDiagram"
        - $ref: "#/components/schemas/SequenceDiagram"
        - $ref: "#/components/schemas/ERDiagram"
      discriminator:
        propertyName: kind
        mapping:
          flow: "#/components/schemas/FlowDiagram"
          sequence: "#/components/schemas/SequenceDiagram"
          er: "#/components/schemas/ERDiagram"

    FlowDiagram:
      type: object
      description: A flow or a state machine.
      required: [kind, direction, nodes, edges, zones]
      properties:
        kind:
          type: string
          enum: [flow]
        direction:
          type: string
          enum: [TB, LR]
        nodes:
          type: array
          items:
            type: object
            required: [id, label, shape]
            properties:
              id:
                type: string
              label:
                type: string
                description: Empty on a start or a stop.
              shape:
                type: string
                enum: [pill, step, decision, start, stop]
              zone:
                type: string
                description: The id of the zone it sits in; absent for none.
              stage:
                type: string
                enum: [production, other, none]
                description: >-
                  The maps' only, the system's and a repository's, absent on a
                  map stored before it: the stage of the system it shows. A box
                  of another stage outside the system map's repositories zone
                  is never served; it is taken out before the map is stored. A
                  repository is kept whatever its stage.
        edges:
          type: array
          items:
            type: object
            required: [from, to, label, dashed, head]
            properties:
              from:
                type: string
              to:
                type: string
              label:
                type: string
              dashed:
                type: boolean
              head:
                type: string
                enum: [end, both, none]
              layer:
                type: string
                enum: [runtime, library, build, deploy, monitoring]
                description: >-
                  The maps' only, the system's and a repository's: what the
                  arrow is. A map drawn with
                  the tags serves runtime and library arrows only, the others
                  taken out before it is stored. A map stored before the tags
                  carries none and is served as it was drawn.
        zones:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id:
                type: string
              title:
                type: string

    SequenceDiagram:
      type: object
      description: An exchange between parts, rows top to bottom.
      required: [kind, actors, rows]
      properties:
        kind:
          type: string
          enum: [sequence]
        actors:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id:
                type: string
              label:
                type: string
        rows:
          type: array
          items:
            type: object
            description: >-
              A message (from, to, label, line, head), a note (from, to,
              side, label), a frame or a divider (keyword, label), or the end
              of a frame.
            required: [type]
            properties:
              type:
                type: string
                enum: [message, note, frame, divider, end]
              from:
                type: string
              to:
                type: string
              label:
                type: string
              line:
                type: string
                enum: [solid, dashed]
              head:
                type: string
                enum: [filled, open, none, cross, both]
              side:
                type: string
                enum: [over, left, right]
              keyword:
                type: string
                enum: [loop, alt, opt, par, critical, break, else, and, option]

    ERDiagram:
      type: object
      description: Entities with their fields and the relationships between them.
      required: [kind, direction, entities, rels]
      properties:
        kind:
          type: string
          enum: [er]
        direction:
          type: string
          enum: [TB, LR]
        entities:
          type: array
          items:
            type: object
            required: [id, label, attrs]
            properties:
              id:
                type: string
              label:
                type: string
              attrs:
                type: array
                items:
                  type: object
                  required: [type, name, keys, comment]
                  properties:
                    type:
                      type: string
                    name:
                      type: string
                    keys:
                      type: array
                      items:
                        type: string
                        enum: [PK, FK, UK]
                    comment:
                      type: string
        rels:
          type: array
          items:
            type: object
            required: [from, to, label, fromCard, toCard, dashed]
            properties:
              from:
                type: string
              to:
                type: string
              label:
                type: string
              fromCard:
                type: string
                enum: [one, zeroOrOne, oneOrMore, zeroOrMore]
              toCard:
                type: string
                enum: [one, zeroOrOne, oneOrMore, zeroOrMore]
              dashed:
                type: boolean

    Description:
      type: object
      description: The current revision of a page.
      required: [revision, summary, statements, source_kind, source_pr_key, source_commit, updated_at]
      properties:
        revision:
          type: integer
        summary:
          type: string
          description: Laid out as a statement's text, sub-headings included.
        statements:
          type: array
          items:
            $ref: "#/components/schemas/Statement"
        source_kind:
          type: string
          enum: [pr, baseline]
        source_pr_key:
          type: string
          description: The PR whose note produced this revision, the first of a fold of several; empty for a baseline.
        source_pr_keys:
          type: array
          items:
            type: string
          description: Every PR a fold of several notes took, in merge order, source_pr_key the first; omitted for one.
        source_commit:
          type: string
          description: The commit a baseline run read; empty for a PR.
        updated_at:
          type: string
          format: date-time

    Repo:
      type: object
      required: [slug, revision, summary, notes, last_merge]
      properties:
        slug:
          type: string
        revision:
          type: integer
        summary:
          type: string
          description: The description's first sentence.
        notes:
          type: integer
        last_merge:
          type: [string, "null"]
          format: date-time

    NoteSummary:
      type: object
      required: [pr_id, pr_key, pr_title, repo_slug, merged_at, items, issues_posted, suggestions_posted]
      properties:
        pr_id:
          type: integer
        pr_key:
          type: string
        pr_title:
          type: string
        repo_slug:
          type: string
        ticket_key:
          type: string
        change_kind:
          type: string
        merged_at:
          type: string
          format: date-time
        items:
          type: integer
          description: Components, rules, invariants and entities in the note.
        issues_posted:
          type: integer
        suggestions_posted:
          type: integer

    Problem:
      type: object
      required: [repo_slug, area, component, bugfixes, top_cause, top_cause_count, issues_posted, suggestions_posted, last_fix_pr_key, last_fix_at]
      properties:
        repo_slug:
          type: string
        area:
          type: string
          description: The shared directory of the fixes' component files; "" when they share nothing.
        component:
          type: string
          description: The most recent component name seen for the area.
        bugfixes:
          type: integer
        top_cause:
          type: string
        top_cause_count:
          type: integer
        issues_posted:
          type: integer
        suggestions_posted:
          type: integer
        last_fix_pr_key:
          type: string
        last_fix_at:
          type: string
          format: date-time

    Problems:
      type: object
      required: [problems, problem_window_days]
      properties:
        problems:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
        problem_window_days:
          type: integer

    ProjectDetail:
      type: object
      required: [key, team, single, description, map, map_expected, map_declined, shape, repos, shared, problems, problem_window_days, recent_notes, revisions, topics]
      properties:
        key:
          type: string
        team:
          type: string
        single:
          type: boolean
          description: >-
            A project of one (its source holds one repository): its
            repository's page is the project's; description and map are then
            null and no map is expected.
        description:
          oneOf:
            - $ref: "#/components/schemas/Description"
            - type: "null"
        map:
          description: >-
            The architecture overview of the current project revision, the
            system at runtime in production: a flow whose zones are clients,
            entry, repositories, stores and external, a
            repository node's id its slug. Null for a project too large for
            one, and before a baseline project
            step drew one.
          oneOf:
            - $ref: "#/components/schemas/FlowDiagram"
            - type: "null"
        map_expected:
          type: boolean
          description: >-
            A baseline run will draw a map: the sources are on, the project
            has more than one source repository, not more of them than one
            map holds, and it is no collection.
        map_declined:
          type: boolean
          description: >-
            A project step asked for the map and none was accepted: map is
            null, and no run is promised to draw one.
        shape:
          type: [string, "null"]
          enum: [system, collection, null]
          description: >-
            What the last project step judged the project to be: one system
            its repositories make together, or a collection of repositories
            that each stand on their own (a short summary, no statements, no
            map). Null before a step judged it, and for a project of one.
        repos:
          type: array
          items:
            $ref: "#/components/schemas/Repo"
        shared:
          type: array
          description: >-
            Repositories of other projects this project's repositories depend
            on, by their manifests (a main build dependency, whatever they
            are; a test, build-tool or version-pin use is none), each with
            its users here: the architecture overview's shared
            zone, drawn by the UI, never stored in the map. Empty with the
            sources off and whenever `map` is null.
          items:
            $ref: "#/components/schemas/SharedRepo"
        problems:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
        problem_window_days:
          type: integer
        recent_notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteSummary"
        revisions:
          type: array
          description: The project page's history, newest first, fifty at most; empty for a project of one.
          items:
            $ref: "#/components/schemas/Revision"
        topics:
          type: array
          description: >-
            The topics the project's source repositories touch, by name, each
            with every source repository on its sides, another project's
            included: read by code from the repositories (never a model's),
            joined at read. Empty with the sources off.
          items:
            $ref: "#/components/schemas/TopicFlow"

    RevisionDetail:
      type: object
      required: [scope, project_key, revision, current, previous, created_at, description, added, changed, dropped, rechecked, summary_changed, map_changed, shape_changed]
      properties:
        scope:
          type: string
          enum: [repository, project]
        project_key:
          type: string
          description: The page's current project key.
        repo_slug:
          type: string
          description: The page's current repository slug; absent on a project page.
        revision:
          type: integer
        current:
          type: integer
          description: The page's current revision number.
        previous:
          type: integer
          description: The revision diffed against; 0 on the first.
        created_at:
          type: string
          format: date-time
        description:
          $ref: "#/components/schemas/Description"
        added:
          type: array
          description: Statements not in the previous revision, in this one's order.
          items:
            $ref: "#/components/schemas/StatementRef"
        changed:
          type: array
          description: Statements whose name, text, files, kind or diagram differ from the previous revision's, in this one's order.
          items:
            $ref: "#/components/schemas/StatementRef"
        dropped:
          type: array
          description: Statements of the previous revision this one no longer holds, in the previous one's order.
          items:
            $ref: "#/components/schemas/StatementRef"
        rechecked:
          type: array
          description: Statements a baseline run confirmed against the code with nothing else of them changed, in this one's order.
          items:
            $ref: "#/components/schemas/StatementRef"
        summary_changed:
          type: boolean
        map_changed:
          type: boolean
          description: The project page's map differs from the previous revision's (on the first, it has one); always false on a repository page.
        shape_changed:
          type: boolean
          description: What the project was judged to be (system, collection) moved against the previous revision; always false on a repository page.

    StatementRef:
      type: object
      required: [id, kind, name]
      properties:
        id:
          type: string
        kind:
          type: string
        name:
          type: string

    Revision:
      type: object
      required: [revision, source_kind, source_pr_key, source_commit, statements, chars, created_at]
      properties:
        revision:
          type: integer
        source_kind:
          type: string
          enum: [pr, baseline]
        source_pr_key:
          type: string
        source_commit:
          type: string
        source_pr_keys:
          type: array
          items:
            type: string
          description: Every PR a fold of several notes took, in merge order, source_pr_key the first; omitted for one.
        statements:
          type: integer
        chars:
          type: integer
          description: Runes of prose in the revision (summary plus every statement's name and text).
        created_at:
          type: string
          format: date-time

    RepoDetail:
      type: object
      required: [project_key, slug, description, map, map_declined, revisions, notes, notes_total, last_merge, uses, used_by, messaging]
      properties:
        project_key:
          type: string
        slug:
          type: string
        map:
          description: >-
            The repository's map of itself (Aufbau): a flow whose zones are
            entry, parts, stores and external. Drawn by a baseline run's last
            step from the repository's description; a merge carries it
            forward. Null before a run's map step drew one.
          oneOf:
            - $ref: "#/components/schemas/FlowDiagram"
            - type: "null"
        map_declined:
          type: boolean
          description: >-
            The map step refused every map it was given for the description
            as it stands (asked again twice in the run): map is null until
            the description changes.
        notes_total:
          type: integer
          description: Every note of the repository; `notes` lists the newest hundred.
        last_merge:
          type: [string, "null"]
          format: date-time
        description:
          oneOf:
            - $ref: "#/components/schemas/Description"
            - type: "null"
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/Revision"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteSummary"
        uses:
          type: array
          description: >-
            The source repositories this one uses at runtime, by its
            manifests (main scope; the others only on `/api/dependencies`).
          items:
            $ref: "#/components/schemas/Use"
        used_by:
          type: array
          description: The source repositories that use this one at runtime (main scope).
          items:
            $ref: "#/components/schemas/DependencyEnd"
        messaging:
          $ref: "#/components/schemas/RepoMessaging"

    DependencyEnd:
      type: object
      required: [project, slug, version]
      properties:
        project:
          type: string
        slug:
          type: string
        version:
          type: string
          description: The version the user's manifest names, as written; empty when it names none.

    Use:
      type: object
      required: [project, slug, version, also]
      properties:
        project:
          type: string
        slug:
          type: string
        version:
          type: string
          description: The version this repository names, as written; empty when none.
        also:
          type: array
          description: Its other users, each with the version it names.
          items:
            $ref: "#/components/schemas/DependencyEnd"

    SharedRepo:
      type: object
      required: [project, slug, used_by]
      properties:
        project:
          type: string
        slug:
          type: string
        used_by:
          type: array
          items:
            $ref: "#/components/schemas/RepoRef"

    RepoMessaging:
      type: object
      description: >-
        What the repository's code says of its messages, read by the poller
        (never a model): the topics it sends to or receives from, each with
        the source repositories on the far side, and the schemas it defines.
        Empty lists with the sources off or before a first read.
      required: [topics, schemas]
      properties:
        topics:
          type: array
          items:
            $ref: "#/components/schemas/RepoTopic"
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/MessageSchema"

    RepoTopic:
      type: object
      required: [name, direction, files, peers]
      properties:
        name:
          type: string
        direction:
          type: string
          enum: [produces, consumes, declares]
          description: declares is a topic the code names without saying which way.
        files:
          type: array
          description: The files that say so.
          items:
            type: string
        peers:
          type: array
          description: >-
            The source repositories on the far side: the consumers of a
            topic it produces, the producers of one it consumes; none for
            declares.
          items:
            $ref: "#/components/schemas/RepoRef"

    MessageSchema:
      type: object
      required: [name, kind, file]
      properties:
        name:
          type: string
          description: The schema's full name (namespace and name).
        kind:
          type: string
          enum: [avro, proto]
        file:
          type: string

    TopicFlow:
      type: object
      required: [name, producers, consumers, declared]
      properties:
        name:
          type: string
        producers:
          type: array
          items:
            $ref: "#/components/schemas/RepoRef"
        consumers:
          type: array
          items:
            $ref: "#/components/schemas/RepoRef"
        declared:
          type: array
          description: Those that name it without code saying which way.
          items:
            $ref: "#/components/schemas/RepoRef"

    RepoRef:
      type: object
      required: [project, slug]
      properties:
        project:
          type: string
        slug:
          type: string

    SearchResult:
      type: object
      required: [query, pages, more]
      properties:
        query:
          type: string
          description: The phrase as searched, trimmed.
        pages:
          type: array
          items:
            $ref: "#/components/schemas/SearchPage"
        more:
          type: integer
          description: Pages that matched beyond the fifty answered.

    SearchPage:
      type: object
      required: [scope, project_key, single, statements]
      properties:
        scope:
          type: string
          enum: [repository, project]
        project_key:
          type: string
        repo_slug:
          type: string
          description: Absent on a project page.
        single:
          type: boolean
          description: The project is one of one; the page is at `/projects/{project_key}`.
        summary:
          type: string
          description: The summary's snippet around its first hit; absent when the summary did not match.
        statements:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"

    SearchHit:
      type: object
      required: [id, kind, name, area, snippet]
      properties:
        id:
          type: string
          description: The statement's id on its page, the `#description/{id}` anchor.
        kind:
          type: string
        name:
          type: string
        area:
          type: string
        snippet:
          type: string
          description: The text around the first hit; empty when only the name, area or a file matched.
        file:
          type: string
          description: The first file that matched, given when the text did not.

    Dependencies:
      type: object
      required: [repos, edges, ambiguous]
      properties:
        repos:
          type: array
          description: The source repositories whose manifests were read.
          items:
            $ref: "#/components/schemas/RepoRef"
        edges:
          type: array
          items:
            type: object
            required: [from, to, version, coords, scope]
            properties:
              from:
                $ref: "#/components/schemas/RepoRef"
              to:
                $ref: "#/components/schemas/RepoRef"
              version:
                type: string
                description: >-
                  What `from` names for the first of the coordinates of the
                  edge's `scope` that names one, as written; empty when none.
              coords:
                type: array
                description: >-
                  The coordinates `from` requires and `to` provides
                  (`go:<module>`, `maven:<group>:<artifact>`, `npm:<name>`,
                  `py:<name>`, `cargo:<crate>`).
                items:
                  type: string
              scope:
                type: string
                enum: [main, managed, dev, test, indirect]
                description: >-
                  The strongest of the coordinates' scopes: `main` a use at
                  runtime, `managed` a version pin (a BOM import, a Gradle
                  platform, a parent POM), `dev` a build or check tool, `test`
                  tests only, `indirect` a go.mod's `// indirect`. Only main
                  edges reach a repository's `uses`, `used_by`, a project's
                  `shared` and the maps.
        ambiguous:
          type: array
          description: Coordinates more than one source repository provides; no edge points at any of them.
          items:
            type: object
            required: [coord, providers, cloned_twice]
            properties:
              coord:
                type: string
              cloned_twice:
                type: boolean
                description: >-
                  The providers are one repository two sources clone (rows
                  from before a clone URL was one row's): removing all but
                  one gives the edges back.
              providers:
                type: array
                items:
                  $ref: "#/components/schemas/RepoRef"

    Taught:
      type: object
      required: [scope, project_key, id, kind, name]
      properties:
        scope:
          type: string
          enum: [repository, project]
        project_key:
          type: string
          description: The page's current project key.
        repo_slug:
          type: string
          description: The page's current repository slug; absent on a project page.
        id:
          type: string
          description: The statement's id on its page, the `#description/{id}` anchor.
        kind:
          type: string
        name:
          type: string

    NoteCallSummary:
      type: object
      required: [outcome, note_status, input_tokens, cache_read_tokens, output_tokens, rounds, rounds_input_tokens, rounds_output_tokens]
      properties:
        outcome:
          type: string
        note_status:
          type: string
        model:
          type: string
        input_tokens:
          type: [integer, "null"]
        cache_read_tokens:
          type: [integer, "null"]
        output_tokens:
          type: [integer, "null"]
        cost_usd:
          type: string
          description: 3-decimal USD; absent when unpriced.
        rounds:
          type: integer
          description: Every note call the PR made; the lanes above are this call alone.
        rounds_input_tokens:
          type: integer
        rounds_output_tokens:
          type: integer
        rounds_cost_usd:
          type: string

    NoteDetail:
      allOf:
        - $ref: "#/components/schemas/NoteSummary"
        - type: object
          required: [project_key, source_commit, bugfix, note, received_at, consolidated_at, note_call, taught, single]
          properties:
            project_key:
              type: string
            jira_issue_type:
              type: string
            reviewed_commit:
              type: string
            source_commit:
              type: string
            merge_commit:
              type: string
            run_id:
              type: integer
            model_label:
              type: string
            bugfix:
              description: The bugfix block of the note, null for anything but a bugfix.
            bugfix_area:
              type: string
            note:
              $ref: "#/components/schemas/Note"
            received_at:
              type: string
              format: date-time
            consolidated_at:
              type: [string, "null"]
              format: date-time
            note_call:
              oneOf:
                - $ref: "#/components/schemas/NoteCallSummary"
                - type: "null"
            taught:
              type: array
              description: |
                The current statements the note is a source of, the
                repository page's then the project's, each in its page's
                order: where the pull request's knowledge stands today. A
                statement dropped since is not listed; a project of one has
                no project page here either, and with the sources on only
                source repositories' pages count, as on the repository
                route. A statement is found under every name the
                project and repository had, so a rename keeps older
                credits listed; a note queued again (a re-delivery) keeps
                what its earlier fold taught. Empty when nothing on the
                pages names the pull request. Links as
                `/projects/{project_key}[/repos/{repo_slug}]#description/{id}`.
              items:
                $ref: "#/components/schemas/Taught"
            single:
              type: boolean
              description: |
                The note's project is one of one: its repository's page is
                the project's, served at `/projects/{project_key}`, so a
                repository entry in `taught` links there. False whenever
                `taught` is empty.
