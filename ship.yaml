# The gate (make check, and ship pre-push in the hook) and the release, see github.com/trick77/ship.
go:
  dir: backend
  coverpkg: ./internal/...
# The store tests' Postgres: compose.yaml's image, the major the deployment runs.
postgres: compose:postgres
steps:
  - { name: openapi lint, run: npx --yes @stoplight/spectral-cli@6.15.0 lint backend/api/openapi.yaml --ruleset .spectral.yaml }
  # The wire contract is noergler's golden payload; our copy must be its
  # master's byte for byte, or a regeneration there went uncopied.
  - { name: golden in step with noergler, run: curl -fsSL https://raw.githubusercontent.com/trick77/noergler/master/backend/internal/almanach/testdata/pr_merged_note.json | diff - backend/internal/ingest/testdata/noergler_pr_merged_note.json }
images:
  - {}
