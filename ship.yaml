# The gate (make check, and ship pre-push in the hook) and the release, see github.com/trick77/ship.
go:
  dir: backend
  coverpkg: ./internal/...
ui:
  # ship empties it but for .gitkeep before the build (vite's emptyOutDir is off).
  embed: backend/web/dist
steps:
  - { name: openapi lint, run: npx --yes @stoplight/spectral-cli@6.15.0 lint backend/api/openapi.yaml --ruleset .spectral.yaml }
  # The wire contract is noergler's golden payload; our copy must be its
  # master's byte for byte, or a regeneration there went uncopied. Downloaded
  # to a file: macOS diff spools stdin to a hardcoded /tmp, which sandboxes deny.
  - name: golden in step with noergler
    run: f=$(mktemp "${TMPDIR:-/tmp}/golden.XXXXXX") && curl -fsSL https://raw.githubusercontent.com/trick77/noergler/master/backend/internal/almanach/testdata/pr_merged_note.json -o "$f" && diff "$f" backend/internal/ingest/testdata/noergler_pr_merged_note.json; rc=$?; rm -f "$f"; exit $rc
images:
  - {}
allow:
  - { rule: distroless, image: "", why: "almanach shells out to git for the clones, which needs a userland" }
