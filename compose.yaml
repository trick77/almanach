# Production stack: the published image behind an external Traefik that
# terminates TLS, readers signed in over OIDC at your identity provider. No
# checkout needed: this file, .env and conf/ are the whole deployment. No
# host port: the only way in is the Traefik router below. Requires the
# external "traefik" network the Traefik stack creates. For local work,
# compose.dev.yaml on top (make dev; README, "Running it").
#
# First-run setup:
#
# 1. Write .env from .env.example and fill it in: the gateway and the model,
#    PUBLIC_FQDN (the hostname Traefik routes Almanach on) and the OIDC
#    block, the client secret and BACKEND_SESSION_SECRET included
#    (openssl rand -base64 48). For private repositories also
#    BACKEND_SOURCE_TOKEN_KEY (openssl rand -base64 32).
#
#      curl -fsSL -o .env https://raw.githubusercontent.com/trick77/almanach/master/.env.example
#
#    The example leaves PUBLIC_FQDN and the OIDC block blank, and this file
#    checks all six: `up` stops with the message next to each until a real
#    value is filled in.
#
#    .env reaches the container whole (env_file below), so any variable
#    .env.example documents needs no compose edit. A value only exported in
#    your shell does not reach the container that way. The six checked
#    lines below are interpolated, though, and for those Compose prefers a
#    shell export over .env: a stale `export BACKEND_OIDC_ISSUER=...` in
#    the shell silently wins. Unset such exports before `up`.
#
#    `docker compose config` prints every value, the env_file's secrets
#    included: never share its output.
#
# 2. One bearer token per team in conf/team-keys.json, the same token in
#    that team's almanach: block in noergler. Mounted read-only,
#    hot-reloaded on change. The container runs as 65532:65532 and reads
#    it through the group; you stay its owner, others get nothing:
#
#      mkdir -p conf && curl -fsSL -o conf/team-keys.json https://raw.githubusercontent.com/trick77/almanach/master/conf/team-keys.example.json
#      sudo chgrp -R 65532 conf && chmod 750 conf && chmod 640 conf/team-keys.json
#
#    conf/ is the container's /conf: a CA bundle for a forge behind an
#    internal CA goes there too, with BACKEND_GIT_CA_FILE=/conf/ca.pem in
#    .env (the path inside the container, never the host's).
#
# 3. docker compose up -d: pulls the image if missing, migrate runs, then
#    almanach. A new release: docker compose pull && docker compose up -d.
#    In a checkout, docker compose up -d --build builds it instead.
#
# The database and the clones live on the named volumes data and repos,
# which take uid 65532 from the image on first mount: nothing to chown. A
# backup is the data volume; the clones refill from the forge. Volumes
# made by an image that still ran as uid 1000 (0.1.2 and before) belong to
# it, and migrate then fails on the database; hand them over once, the
# stack down, outside compose (its cap_drop forbids a chown). The volume
# names carry the project, the folder's name by default:
#
#      docker run --rm --user 0 --entrypoint chown -v almanach_data:/data -v almanach_repos:/app/repos ghcr.io/trick77/almanach:latest -R 65532:65532 /data /app/repos
#
# Needs Docker Compose 2.24.4 or later: older versions reject the long
# env_file form (path/required) and the !override tag of compose.dev.yaml.

# What both services share: the image and the hardening.
x-almanach: &almanach
  image: ghcr.io/trick77/almanach:latest
  user: "65532:65532"
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  read_only: true
  # git and SQLite want a writable temp dir; the root filesystem is not.
  tmpfs:
    - /tmp

services:
  # Same as the init container in the deployment: migrations run before the
  # service, never inside it. Same image, same data volume.
  migrate:
    <<: *almanach
    command: ["migrate"]
    # No env_file: migrate needs the database path and nothing else, least
    # of all the gateway key.
    environment:
      BACKEND_DB_PATH: /data/almanach.db
      TMPDIR: /tmp
      BACKEND_LOG_LEVEL: INFO
    volumes:
      - data:/data

  almanach:
    <<: *almanach
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    # Longer than serve's own shutdown: the HTTP drain (15 s), then the
    # worker's grace for the paid call in flight and its writes
    # (inference.CallTimeout + 15 s = 10 min 15 s, cmd/almanach/main.go).
    # Docker's default 10 s would SIGKILL that call and pay for nothing.
    stop_grace_period: 11m
    # Almanach is PID 1 in here and reaps only the git it runs itself. git
    # fetch forks a detached helper (gc --auto) that is orphaned to PID 1
    # and exits later: without an init every fetch leaves a zombie behind.
    # tini reaps them; docker-init is bind-mounted from the host, so the
    # read-only, cap-dropped setup is untouched.
    init: true
    env_file:
      - path: .env
        required: false
    # What this file sets itself, which wins over .env. The paths and the
    # listener: .env's are the host's view, for the binary run outside
    # compose, and must not reach the container. A loopback BACKEND_ADDR set
    # for a host run would bind inside the container's own namespace, the
    # router dead and the healthcheck (same env) still green.
    environment:
      BACKEND_DB_PATH: /data/almanach.db
      BACKEND_TEAM_KEYS_PATH: /conf/team-keys.json
      BACKEND_REPOS_DIR: /app/repos
      BACKEND_ADDR: 0.0.0.0:8080
      # git needs a writable home and temp dir; the root filesystem is
      # read-only. The image's user has /tmp as home, but USER exports no
      # HOME.
      HOME: /tmp
      TMPDIR: /tmp
      # Fixed, not interpolated: a stray none in .env must not open the
      # stack. compose.dev.yaml alone sets none.
      BACKEND_AUTH_MODE: oidc
      # Checked here, so `up` stops with the message instead of the
      # container restarting in a loop. Interpolated: a shell export wins
      # over .env (step 1 above).
      BACKEND_OIDC_ISSUER: ${BACKEND_OIDC_ISSUER:?set it in .env, the provider's issuer exactly as it states it; see .env.example}
      BACKEND_OIDC_CLIENT_ID: ${BACKEND_OIDC_CLIENT_ID:?set it in .env, the client registered for Almanach; see .env.example}
      BACKEND_OIDC_CLIENT_SECRET: ${BACKEND_OIDC_CLIENT_SECRET:?set it in .env, the client's secret at the provider; see .env.example}
      BACKEND_OIDC_REDIRECT_URL: ${BACKEND_OIDC_REDIRECT_URL:?set it in .env, https://<PUBLIC_FQDN>/api/auth/callback; see .env.example}
      BACKEND_SESSION_SECRET: ${BACKEND_SESSION_SECRET:?set it in .env, openssl rand -base64 48; see .env.example}
    volumes:
      # The database alone: the file and its -wal, -shm. Never a shared
      # filesystem: SQLite in WAL needs the locks of one local disk.
      - data:/data
      # Every source's clones, p<project id>/r<repo id>. Apart from the database: a
      # clone volume can be wiped and refilled from the forge, the data
      # volume cannot.
      - repos:/app/repos
      # The directory, not the file: a bind mount of a file missing on the
      # host makes Docker create a DIRECTORY at that path, and the keys file
      # then reads as "is a directory" forever. Mounting ./conf means a
      # missing file is simply a missing file. Read-only: Almanach never
      # writes what an operator maintains by hand.
      - ./conf:/conf:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The healthcheck is the image's own exec probe (-healthcheck).
    networks:
      - traefik
      - default
    labels:
      # One image serves the API, the webhook and the embedded UI on :8080.
      # No auth middleware: Almanach is an OIDC client and does its own
      # login; the webhook and the ping are bearer only.
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.almanach.rule: Host(`${PUBLIC_FQDN:?set PUBLIC_FQDN in .env, the hostname Traefik routes Almanach on}`)
      traefik.http.routers.almanach.entrypoints: websecure
      traefik.http.routers.almanach.tls: "true"
      traefik.http.services.almanach.loadbalancer.server.port: "8080"

volumes:
  data:
  repos:

networks:
  # Created by the Traefik stack, not by this one.
  traefik:
    external: true
