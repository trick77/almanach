# The database file, once: on the data volume, which both services mount.
x-db-path: &db-path ALMANACH_DB_PATH=/data/almanach.db

services:
  # Same as the init container in the deployment: migrations run before the
  # service, never inside it. Same image, same data volume.
  migrate:
    build:
      context: .
      dockerfile: Containerfile
    command: ["migrate"]
    # No env_file: migrate needs the database path and nothing else, least
    # of all the gateway key. Fixed, not interpolated: .env's
    # ALMANACH_DB_PATH is the host's view (for the binary run outside
    # compose) and must not reach a container.
    environment:
      - *db-path
      - LOG_LEVEL=INFO
    volumes:
      - data:/data

  almanach:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8081:8080"
    env_file: .env
    # What the container must not take from .env: the database path, the
    # keys path and the listener. A loopback SERVER_HOST or proxy mode set
    # for a host run would bind inside the container's own namespace, with
    # the port mapping dead and the healthcheck (same env) still green.
    environment:
      - *db-path
      - ALMANACH_TEAM_KEYS_PATH=/app/team-keys.json
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - ALMANACH_AUTH_MODE=none
      # The clones live on the repos volume; the host's view of the folder
      # (a path outside compose) must not reach the container.
      - ALMANACH_REPOS_DIR=/app/repos
    volumes:
      # The database alone: the file and its -wal, -shm. Owned by uid 1000
      # from the image's own /data on first mount. Never a shared
      # filesystem: SQLite in WAL needs the locks of one local disk.
      - data:/data
      # One token per team; see team-keys.example.json.
      - ./team-keys.json:/app/team-keys.json:ro
      # Every source's clones, <project>/<slug>. Owned by uid 1000 from the
      # image's own /app/repos on first mount. Apart from the database: a
      # clone volume can be wiped and refilled from the forge, the data
      # volume cannot.
      - repos:/app/repos
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  data:
  repos:
