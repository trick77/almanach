# The in-network DSN, once: the postgres service's user, password and db.
x-dsn: &dsn DATABASE_URL=postgresql://almanach:changeme@postgres:5432/almanach

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: almanach
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: almanach
    ports:
      - "5433:5432"
    # The parent, not .../data: from 18 the image keeps PGDATA in a
    # versioned subdirectory and refuses to start on the old mount.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almanach"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Same as the init container in the deployment: migrations run before the
  # service, never inside it.
  migrate:
    build:
      context: .
      dockerfile: Containerfile
    command: ["migrate"]
    # No env_file: migrate needs the DSN and nothing else, least of all the
    # gateway key. Fixed, not interpolated: .env's DATABASE_URL is the
    # host's view (localhost:5433, for the binary run outside compose) and
    # must not reach a container, where only the service name resolves.
    environment:
      - *dsn
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy

  almanach:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8081:8080"
    env_file: .env
    # What the container must not take from .env: the DSN, the keys path
    # and the listener. A loopback SERVER_HOST set for a host run would bind
    # inside the container's own namespace, with the port mapping dead and
    # the healthcheck (same env) still green. Auth stays none here: oidc
    # needs a provider and an https callback this local stack has not got.
    environment:
      - *dsn
      - ALMANACH_TEAM_KEYS_PATH=/app/team-keys.json
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - ALMANACH_AUTH_MODE=none
      # Blank, so an .env filled in for oidc still starts here: serve
      # refuses every oidc variable under none, and blank counts as unset.
      - ALMANACH_OIDC_ISSUER=
      - ALMANACH_OIDC_CLIENT_ID=
      - ALMANACH_OIDC_CLIENT_SECRET=
      - ALMANACH_OIDC_REDIRECT_URL=
      - ALMANACH_SESSION_SECRET=
      # The clones live on the repos volume; the host's view of the folder
      # (a path outside compose) must not reach the container.
      - ALMANACH_REPOS_DIR=/app/repos
    volumes:
      # One token per team; see team-keys.example.json.
      - ./team-keys.json:/app/team-keys.json:ro
      # Every source's clones, <project>/<slug>. Owned by uid 1000 from the
      # image's own /app/repos on first mount.
      - repos:/app/repos
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  repos:
