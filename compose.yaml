# The in-network DSN, once: the postgres service's user, password and db.
x-dsn: &dsn DATABASE_URL=postgresql://almanach:changeme@postgres:5432/almanach

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: almanach
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: almanach
    ports:
      - "5433:5432"
    # The parent, not .../data: from 18 the image keeps PGDATA in a
    # versioned subdirectory and refuses to start on the old mount.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almanach"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Same as the init container in the deployment: migrations run before the
  # service, never inside it.
  migrate:
    build:
      context: .
      dockerfile: Containerfile
    command: ["migrate"]
    # No env_file: migrate needs the DSN and nothing else, least of all the
    # gateway key. Fixed, not interpolated: .env's DATABASE_URL is the
    # host's view (localhost:5433, for the binary run outside compose) and
    # must not reach a container, where only the service name resolves.
    environment:
      - *dsn
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy

  almanach:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8081:8080"
    env_file: .env
    # What the container must not take from .env: the DSN, the keys path
    # and the listener. A loopback SERVER_HOST or proxy mode set for a host
    # run would bind inside the container's own namespace, with the port
    # mapping dead and the healthcheck (same env) still green.
    environment:
      - *dsn
      - ALMANACH_TEAM_KEYS_PATH=/app/team-keys.json
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - ALMANACH_AUTH_MODE=none
    volumes:
      # One token per team; see team-keys.example.json.
      - ./team-keys.json:/app/team-keys.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
